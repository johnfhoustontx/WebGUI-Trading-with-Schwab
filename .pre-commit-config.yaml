# Pre-commit hooks — an OPTIONAL, wider set for anyone who uses the pre-commit tool.
#
# ⚠ This file is NOT what enforces the lint gate, and for months nothing did: it
# only takes effect after `pre-commit install`, which was never run in any clone
# (audit CQ-02). The gate that is enforced is the repository's own hook,
#     tools/git-hooks/pre-commit      (ruff over the staged Python files)
# enabled per clone by
#     python tools/install_git_hooks.py
# plus tools/tests/test_lint_gate.py, which fails the suite on a finding.
#
# To use this file as well:  pip install pre-commit && pre-commit install
# (that writes .git/hooks/pre-commit, which core.hooksPath overrides — pick one).
# Run on all files:  pre-commit run --all-files
#
# Ruff config lives in pyproject.toml [tool.ruff] (scope + rules). These hooks lint
# only the in-scope, non-grandfathered code — see docs/audits/2026-07-02-best-practices-validation.md.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.5
    hooks:
      - id: ruff              # lint (uses pyproject.toml: select E9,F63,F7,F82)
        args: [--fix]
        # ruff-format is intentionally omitted — the codebase's compact one-line
        # style is deliberate; enforcing the formatter would rewrite it wholesale.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(md|bak)$'
      - id: end-of-file-fixer
        exclude: '\.(md|bak)$'
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]   # block accidental commit of DBs / xlsx / big blobs
      - id: check-merge-conflict
      - id: detect-private-key   # cheap secret-in-commit guard
