# Template for config/env.local.toml — copy this file to that name and edit.
# The real file is GITIGNORED on purpose: a `git pull` must never be able to
# carry an environment identity from one checkout into the other.
#
# A MISSING file resolves to "prod", so a checkout without one behaves exactly
# as this repo did before environments existed. Profiles live in the tracked
# config/environments.toml. See docs/plans/2026-08-08-dev-prod-environments-design.md.

# "dev" | "prod". Anything else (or a missing key) resolves to "prod".
name = "prod"

# Optional. Absolute path to the OTHER checkout — the snapshot tool needs prod's
# path, and that path is machine-local, which is why it lives here and not in
# environments.toml.
#
# NOTE the SINGLE quotes: TOML basic strings ("...") treat backslash as an escape,
# so "D:\WebGUI Trading Prod" is an invalid \W escape that kills the WHOLE
# document — name included — and the checkout silently resolves to prod. A TOML
# literal string ('...') takes the path verbatim, so Windows paths are safe here.
# Forward slashes in a basic string work too.
# peer_root = 'D:\WebGUI Trading Prod'

# Optional. WHERE this checkout reaches the Schwab proxy. Defaults to 127.0.0.1
# in both profiles, which is right whenever the two checkouts share a machine —
# dev owns no proxy of its own and borrows prod's on :8100.
#
# Set it ONLY when the peer checkout is on a DIFFERENT HOST, e.g. a VPS shadow
# stack borrowing a workstation's proxy across a Tailscale network. Machine-local
# for the same reason peer_root is: the address is a property of where this box
# sits, not of which environment it is.
#
# ⚠ It moves PROXY_URL and nothing else. Services, the web GUI and Redis stay on
# loopback because every host runs its own — pointing those at a peer would make
# this checkout drive that stack's services and write its Redis.
#
# ⚠ NEVER expose a proxy port to the public internet to make this work. It is
# unauthenticated. Use a private network.
# proxy_host = "100.64.1.2"          # or a Tailscale name: "prod.tailnet.ts.net"

# Optional. The three PUBLIC hostnames this box answers on, read by
# deploy/caddy/generate_caddyfile.py — which derives the whole edge config from
# them, exactly as the systemd units are derived from the ports.
#
# `site_host` carries the static one-pager served out of deploy/site/;
# `app_host` carries the web GUI behind the login, and DEFAULTS to
# "app.<site_host>" — set it only if the app lives on some other name;
# `live_host` carries the PUBLIC read-only screens — a second NiceGUI process
# with no login at all — and DEFAULTS to "live.<site_host>".
#
# They are separate ORIGINS rather than paths on one host deliberately: the
# public page carries third-party links and embeds, and sharing an origin would
# put someone else's widget inside the app's cookie scope. `live_host` is a
# third origin for the same class of reason — the app is behind a login and the
# live screens are not, so they are separated by ORIGIN rather than by a path
# filter someone has to get right.
#
# Machine-local for the same reason peer_root and proxy_host are — the domain is
# a property of the box that answers on :443, not of which environment a
# checkout is. Omitting both is fine: the generator refuses to run outside a
# prod checkout, so its defaults can never reach a live edge.
# site_host = "neuralstrike.co"
# app_host  = "app.neuralstrike.co"
# live_host = "live.neuralstrike.co"

# Save this file as UTF-8. PowerShell's `>` and Out-File write UTF-8 *with BOM*;
# the loader strips a BOM (utf-8-sig), but other tools reading it may not.

# ── NOT set here: the public live screens' Redis credential ──────────────────
#
# `REDIS_LIVE_URL` is an ENVIRONMENT VARIABLE, read by webgui/live_main.py and
# by nothing else. It lives in this checkout's `.env.live` — a file of its own,
# NOT the stack's `.env`, because the one internet-facing process in the fleet
# must not hold the fleet's strongest credentials. See
# deploy/systemd/generate_units.py:_live_env_file.
#
# ⚠ IT CARRIES THE REDIS DB INDEX IN ITS PATH, so it BYPASSES the `redis_db`
# this file's profile selects. `redis://live:pw@127.0.0.1:6379/0` is prod's db;
# copying that line from prod's `.env.live` into dev's aims DEV's public process
# at PROD's data, and every published screen then renders prod's real book while
# the checkout looks like dev. `live_main.resolve_acl_url` warns on a mismatch;
# the warning is in the journal, which is not where anyone is looking. Write the
# index for THIS checkout — dev is db 1.
#
# ⚠ Unset or empty, the process falls back to the stack's ordinary full
# read/write credential — on an origin with no login. `live_main` REFUSES to
# serve prod in that state and only warns in dev.
