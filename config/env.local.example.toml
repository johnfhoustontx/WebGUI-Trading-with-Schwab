# Template for config/env.local.toml — copy this file to that name and edit.
# The real file is GITIGNORED on purpose: a `git pull` must never be able to
# carry an environment identity from one checkout into the other.
#
# A MISSING file resolves to "prod", so a checkout without one behaves exactly
# as this repo did before environments existed. Profiles live in the tracked
# config/environments.toml. See docs/plans/2026-08-08-dev-prod-environments-design.md.

# "dev" | "prod". Anything else (or a missing key) resolves to "prod".
name = "prod"

# Optional. Absolute path to the OTHER checkout — the snapshot tool needs prod's
# path, and that path is machine-local, which is why it lives here and not in
# environments.toml.
#
# NOTE the SINGLE quotes: TOML basic strings ("...") treat backslash as an escape,
# so "D:\WebGUI Trading Prod" is an invalid \W escape that kills the WHOLE
# document — name included — and the checkout silently resolves to prod. A TOML
# literal string ('...') takes the path verbatim, so Windows paths are safe here.
# Forward slashes in a basic string work too.
# peer_root = 'D:\WebGUI Trading Prod'

# Optional. WHERE this checkout reaches the Schwab proxy. Defaults to 127.0.0.1
# in both profiles, which is right whenever the two checkouts share a machine —
# dev owns no proxy of its own and borrows prod's on :8100.
#
# Set it ONLY when the peer checkout is on a DIFFERENT HOST, e.g. a VPS shadow
# stack borrowing a workstation's proxy across a Tailscale network. Machine-local
# for the same reason peer_root is: the address is a property of where this box
# sits, not of which environment it is.
#
# ⚠ It moves PROXY_URL and nothing else. Services, the web GUI and Redis stay on
# loopback because every host runs its own — pointing those at a peer would make
# this checkout drive that stack's services and write its Redis.
#
# ⚠ NEVER expose a proxy port to the public internet to make this work. It is
# unauthenticated. Use a private network.
# proxy_host = "100.64.1.2"          # or a Tailscale name: "prod.tailnet.ts.net"

# Save this file as UTF-8. PowerShell's `>` and Out-File write UTF-8 *with BOM*;
# the loader strips a BOM (utf-8-sig), but other tools reading it may not.
