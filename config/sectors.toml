# ─────────────────────────────────────────────────────────────────────────────
# config/sectors.toml — WHICH NAMES MOVE TOGETHER
#
#   The symbol → sector map behind the paper engine's SECTOR cap
#   (paper_concentration.concentration_reject, gap assessment B4), read through
#   shared/sectors.py. Edit + restart options_svc.
#
#   ⚠ WHY A FILE AND NOT A DERIVATION. There is no algorithmic source for a
#     symbol's sector in this repo, and the one data source that existed —
#     sentiment-dashboard/Sectors_Industries_ETFs.xlsx, 5 constituents per
#     industry — covered only **48 of the 80 watchlist symbols**, missing
#     precisely the names the cap is for: MU, AMAT, MRVL, INTC, TXN, ALAB, SMCI,
#     DELL and SPCX were all absent, and **181 of 273 historical paper positions
#     (66%) were on symbols it did not know**. A cap keyed on that map would have
#     read as protection while covering a third of the book. The workbook seeded
#     the 311 names it does carry; the rest were classified from the proxy's own
#     /instruments descriptions.
#
#   ⚠ AN UNMAPPED SYMBOL IS ITS OWN BUCKET, NEVER POOLED. shared/sectors.py
#     returns None, and the cap then groups that symbol alone — so a new
#     watchlist name is capped exactly as it was before (the per-symbol rungs)
#     and can neither escape into another sector's allowance nor drag unrelated
#     names into one. It is logged, so the gap is countable rather than silent.
#
#   ⚠ VALUES ARE THE 11 GICS SECTORS, spelled as sentiment-dashboard's
#     sectors_ref uses them, plus INDEX. Matching that vocabulary is deliberate:
#     the two halves of the app should not disagree about what sector a name is
#     in. shared/sectors.SECTORS is the closed set and a test pins every value
#     here against it, so a typo is a failure rather than a 344th "sector" of
#     one member.
#
#   ⚠ INDEX IS CAPPED, NOT EXEMPT, and that is a measured decision. $SPX / SPY /
#     QQQ / $NDX / DIA / IWM look like the diversified case, but measured over
#     six months of daily returns their mean pairwise correlation is **0.799** —
#     the second-tightest group in the whole universe, behind only Energy
#     (0.846). Nine simultaneous index positions is one big market bet, which is
#     exactly what a sector cap exists to refuse. The driver book held nine, for
#     $15,018.
#
#   Where the grouping is WEAKEST, for the record: Information Technology is 30
#   of the 74 tradeable watchlist names and its internal correlation (0.240) is
#   only average, because it holds IBM and TXN alongside IONQ/RGTI (0.939) and
#   CRWV/NBIS (0.838). A tighter "theme" grouping would control those sub-clusters
#   better; it is not shipped because it would be invented rather than sourced.
#   Overall the premise holds well: within-sector mean correlation **0.250** vs
#   **0.017** across sectors, and 14 of the 15 most-correlated pairs in the
#   universe share a sector.
#
#   Sibling files: config/scanner.toml decides whether a signal fires,
#   config/trade_mgmt.toml how it exits, config/symbols.toml which names are
#   collected.
# ─────────────────────────────────────────────────────────────────────────────

