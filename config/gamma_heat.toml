# The Dealer Positioning heatmap's controls (design:
# docs/plans/2026-10-09-gamma-heatmap-value-scale-frame-design.md).
# Read through shared/gamma_heat_config.py, per paint, so a saved change
# applies with no restart.

[balanced]
# A strike is marked "Balanced" when its calls and puts nearly cancel:
# abs(net) / (abs(calls) + abs(puts)) at or under this.
max_polarity = 0.15
# ...and it is among the largest strikes on screen: at or above this quantile
# of size across the visible window.
min_size_quantile = 0.8
# At most this many markers, largest first. 0 turns the markers off.
max_marks = 3

[lock]
# The heatmap's "Locked" colour scale is set once a session by options_svc, from
# the session's first this-many minutes, and then held. Until they have passed
# the scale adapts to what is on screen.
minutes = 60
# The quantile of the absolute cell taken over those minutes, inside the display
# window around each minute's own spot.
quantile = 0.95
# Multiplied on, so the first hour's largest cells are not already at the top of
# the scale.
headroom = 1.5

[show]
# The heatmap's "Change over N min" view: each cell less the same strike's cell
# this many minutes earlier. Read by the page each time it draws.
change_window_min = 30

[window]
# Strikes shown each side of spot on the bars and the heatmap, and kept each
# side of the current spot in the history options_svc publishes. Both tiers read
# it when they draw or publish, so no restart is needed.
n_side = 20
# Strikes drawn each side of price in the heatmap's "From spot" frame. The
# service keeps the same number each side of the session's LOW and HIGH in the
# published history, so that frame is never short of data on a trending day.
# Every strike here is paid for in each view's history, every minute: measured on
# stored sessions with tools/measure_gamma_crop.py, 10 added about 12% to $SPX's
# history on its widest stored day (a 1.1% range) and nothing on a quiet one; 20
# added about 40%. Never more than n_side. 0 keeps no extra strikes, and the
# frame then shows gaps where a column has none.
spot_side = 10
