# Market session windows + the extended-hours activation date.
#
# All times are America/Chicago (CT). ET and CT observe DST together, so these
# CT values are stable year-round and need no seasonal adjustment.
#
# Edit + restart the affected service to change a window. See
# docs/plans/2026-08-02-options-extended-hours-design.md.

[activation]
# Cboe extended trading hours for select multi-listed equity options. Every ETH
# branch in the codebase is INERT before this date: session_at() reports
# "closed" for the ETH windows and all behavior is byte-identical to the
# pre-ETH app. Confirmed in Cboe notice C2026061202, which records it as a
# delay from 2026-07-13 pending regulatory approval.
extended_hours_from = "2026-08-17"

# -- Sessions (Cboe's own vocabulary: GTH and Curb, NOT "premarket") ---------
[sessions.gth]
start = "06:30"   # 07:30 ET
end   = "08:25"   # 09:25 ET

[sessions.regular]
start = "08:30"   # 09:30 ET
end   = "15:00"   # 16:00 ET

[sessions.curb]
start = "15:00"   # 16:00 ET
end   = "15:15"   # 16:15 ET

# -- Named operating windows (service cadence windows, NOT market sessions) --
# These legitimately differ from each other and are kept distinct, not merged.
[windows.scan]
# options_svc auto-scan operating window (includes premarket by design).
start = "08:00"
end   = "15:15"

[windows.collection]
# GEX history collection. `start` is the full-universe start; `eth_start`
# applies ONLY to ethOptionEligible symbols on/after the activation date.
start     = "08:00"
eth_start = "06:30"
stop      = "15:20"

[windows.session_flip]
# When the Gamma display flips from the prior session to today. Held SEPARATE
# from collection.start on purpose: widening GTH collection must not silently
# move the display flip.
at = "08:00"

[windows.market_snapshot]
start = "08:30"
end   = "15:00"

[windows.stream]
# The public YouTube wall stream. The bounds match [windows.collection] on
# purpose -- the broadcast should be live exactly when the dashboards have
# moving data, because a stream of frozen overnight numbers is worse than no
# stream. But it is held SEPARATE, like session_flip is: widening collection
# must not silently extend a public broadcast.
start = "08:00"   # 09:00 ET
end   = "15:20"   # 16:20 ET

[windows.live_capture]
# Thumbnail captures for the public grid on neuralstrike.co/live.html.
# Held SEPARATE from [windows.collection] for the reason [windows.stream] gives:
# widening collection must not silently extend a public surface.
start = "08:00"
end   = "15:20"

[windows.driver_entry]
# Autonomous driver entry window, in ET (not CT) — matches the existing
# constant it replaces. Skips the open's first ~15 min and takes no new
# entries in the last 30 min before the close.
tz    = "America/New_York"
start = "09:45"
end   = "15:30"
# The legacy predicate is `hm < start or hm >= end` -- the END IS EXCLUSIVE, so
# the whole 15:30 ET minute is outside the window. That enforces "no new entries
# in the last 30 min before the close", so it must not drift to inclusive.
end_exclusive = true

# -- Scheduled slots (a named clock mark a service fires at, once per day) ---
# Each slot fires ONCE per trading day, within `grace_min` minutes of its target,
# so a missed 30 s tick or a mid-window service start still fires it - but a
# long-late start does NOT backfill a stale slot.

[slots.analyze]
# The scheduled Claude briefings on the Dealer Positioning page. EACH FIRING IS A
# PAID CLAUDE CALL, so this table is the direct control on that spend: delete a
# line to drop a briefing, add one to gain a briefing. Times CT, ET in comments.
grace_min = 20
premarket = "08:00"   # 09:00 ET
open      = "08:48"   # 09:48 ET - ~18 min after the 09:30 open
midday    = "11:30"   # 12:30 ET
close     = "15:15"   # 16:15 ET - EOD retrospective, after the 15:00 CT cash close

[slots.action_alert]
# The thrice-daily "trades needing action" digest pushed to Telegram/Discord.
# This is what decides how often your phone buzzes.
grace_min = 20
morning = "10:00"
midday  = "13:00"
close   = "15:00"     # pre-close sweep

[slots.income]
# The 30-45 DTE income scan (two-sided credit spreads + cash-secured puts).
# ONE pass a day by design: a 35-DTE candidate does not meaningfully re-rank
# inside fifteen minutes, and running it on the autoscan's cadence would cost
# ~690 extra /chains calls a day instead of ~23. After the open so the chain
# carries real marks rather than overnight stubs.
grace_min = 20
morning = "08:45"     # 09:45 ET

[slots.calibration]
# The nightly signal-calibration rebuild -> cache:options:calibration, the
# realized-outcome EV the Trade detail panel shows. AFTER [windows.collection]
# stop (15:20) and after the momentum slot, so the day's outcomes have settled:
# recomputing mid-session would publish a bucket table that changes under the
# reader. Cheap and local -- it reads signals.db, makes no Schwab or Claude call.
at = "16:30"

[slots.gallery_capture]
# The App gallery on neuralstrike.co, re-photographed from the PRIVATE app on
# loopback (tools/capture_gallery_shots.py) so the tiles carry current branding
# and current numbers. Half an hour after the 08:30 CT regular open, so the
# screens have painted live data -- a pre-open run publishes a gallery of blank
# panels and overnight marks.
#
# ⚠ :07 AND NOT :00, AND THE SEVEN MINUTES ARE LOAD-BEARING. The live-screen
# thumbnail timer runs OnCalendar=*:0/15, so :00/:15/:30/:45 already carry a
# headless-Chrome storm. Measured on prod 2026-09-08 during the 09:00 live
# capture: load average 2.11 -> 11.84 on 4 vCPU, proxy /health 0.82s -> 18.2s,
# and since webgui/proxy.py health() times out at 3s every page painted the
# proxy-down banner. It cost SEVEN GEX collection slots before 09:02. This job
# is the heavier of the two (19 shots at 12s settle against 14 at 8s), so
# stacking it on that minute would roughly triple the worst spike of the day.
# The offset keeps the two peaks apart; CPUQuota on the unit keeps this one
# from making its own. See _gallery_capture_units in generate_units.py.
#
# WHAT A FIRING COSTS: 19 page loads against the local web app (three of the 22
# tiles are Simulator views that live in page state and are deliberately
# skipped). NO SCHWAB CALL and NO CLAUDE CALL -- unlike [slots.analyze] above,
# where EACH FIRING IS A PAID CLAUDE CALL, and unlike [slots.income], the
# largest scheduled Schwab spend on this table. The whole cost here is ~20
# minutes of a headless Chrome and some CPU on the box that already serves the
# app.
#
# ⚠ Read by SYSTEMD, not by a service scheduler: generate_units.py turns it
# into trading-<env>-gallery-capture.timer's OnCalendar. Changing this time
# needs `python -m deploy.systemd.generate_units --install` and a
# `systemctl --user daemon-reload`; a service restart will not pick it up.
at = "09:07"     # 10:07 ET -- off the quarter hour, deliberately

[slots.momentum]
# The nightly momentum cascade: ~80 min after the 15:00 CT cash close, so the
# day's daily bars have settled at the proxy. Moving it earlier will silently
# score stale bars.
at = "16:20"

[alerts]
# Fire phone pushes / in-app toasts during extended sessions. Off by default:
# a 06:30 CT push on a handful of thin GTH prints is noise, and the execution
# posture is observe-only. Data still accrues either way.
fire_in_extended_hours = false
