# ─────────────────────────────────────────────────────────────────────────────
# config/trade_mgmt.toml — WHEN TO TAKE PROFIT AND WHEN TO CUT
#
#   Your stop rules. Edit + restart options_svc. Anything omitted falls back to
#   the built-in default in shared/trade_mgmt.py, so a partial file is fine.
#
#   ⚠ [stops] is read by BOTH sides of trade management and they must agree:
#       * options-scanner/signal_recommender.py — the auto-manage cycle that
#         actually closes positions.
#       * services/options_svc/rescue.py — the at-risk board that flags them.
#     rescue.py used to restate four of these by hand under a comment asking
#     future editors to mirror them. It now DERIVES them, so a disagreement is no
#     longer possible: change a number here and both sides move together.
#
#   These apply to the manual paper book's managed signals. The autonomous
#   driver's separate envelope is config/driver.toml.
# ─────────────────────────────────────────────────────────────────────────────

[stops]
# ⚠ Reaching tp_frac does TWO DIFFERENT THINGS depending on the book, and this
# comment claimed only the first for months:
#   * CAPTURED SIGNALS arm a break-even stop and keep running with the downside
#     pinned; the [trail] ladder decides whether it then ratchets further.
#   * The MANUAL PAPER BOOK and the DRIVER close outright at this fraction. The
#     manual book can opt into the captured behaviour — Settings →
#     manual_paper_lifecycle_enabled, default OFF — and the driver cannot.
# Published research is split on which is better, so neither is "the" rule; see
# docs/plans/2026-09-11-options-strategy-gap-assessment.md §3.2.
tp_frac = 0.50            # fraction of credit captured

stop_mult = 2.0           # cut at >= this multiple of the credit, as a loss

# Delta discipline on the SHORT leg. delta_drift is relative to the entry delta;
# delta_hard_ceiling is absolute and always wins, so a position entered at an
# already-rich delta cannot be held indefinitely. delta_abs_fallback applies when
# the entry delta was never recorded.
delta_drift        = 0.12
delta_hard_ceiling = 0.45
delta_abs_fallback = 0.35

cut_dte = 2               # cut when DTE <= this AND underwater

# A soft delta stop can be DEFERRED when the trade still has room to recover:
# both of these must hold, or the stop fires.
recovery_dte_min     = 5
recovery_min_cushion = 0.015    # 1.5% spot <-> short-strike cushion

[trail]
# Peak-driven profit-lock ladder for the armed break-even stop. Each rung is
# [peak_frac, lock_frac]: once PEAK profit reaches peak_frac of the credit, the
# stop ratchets up to lock in lock_frac of it.
#
# The DEFAULT is a single break-even rung (lock 0.0) — exactly the plain
# break-even stop — so the ratchet is INERT unless a caller passes a richer
# ladder plus peak_pnl_frac. ratchet_ladder is the sensible opt-in: lock +25% of
# the credit once peak >= 65%, +50% once peak >= 80%.
default_ladder = [[0.50, 0.0]]
ratchet_ladder = [[0.50, 0.0], [0.65, 0.25], [0.80, 0.50]]

# WHICH ladder is in force: "default" (a single break-even rung - the plain
# break-even stop) or "ratchet". Anything else falls back to "default", because a
# typo in a risk config must never switch on an untried policy.
#
# ⚠ Measured before switching this on (gap assessment C2). Replaying all 281 closed
#   captured signals against their OWN mark series, with a 10%-of-credit slippage
#   haircut on every ladder exit:
#     close outright at +50%   +$4,788
#     break-even stop (was)    +$8,173
#     ratchet 65/80 (now)      +$8,556     <- +$383, +4.7%
#   Better on 43 trades, worse on 18, identical on 220, and ahead in EVERY month
#   (Jul +0 / Aug +299 / Sep +84) and both scanner types (0DTE +124, SWING +259).
#   ⚠ It reverses at a 50% haircut (+$6,526 vs +$6,924): a higher floor triggers
#   more often, so it pays slippage more often. The edge is real and small.
#
# It cannot increase LOSS exposure on any path - signal_recommender rule 3 takes
# max(be_level, locked_level), so a lock only ever raises a stop already above
# break-even. Its cost is exiting a recovered winner early (the 18 above).
active = "ratchet"

[structures]
# ─── PER-STRUCTURE OVERRIDES ON EVERYTHING ABOVE ────────────────────────────
#
#   A structure's table OVERLAYS [stops]: name only what differs and the rest is
#   inherited. A structure with no table here gets the global rules with every
#   loss-side stop on — which is what every credit spread already did, so adding
#   a table can only ever change the structure it names.
#
#   Keyed on the CANONICAL structure name (shared/structures.py). The short put
#   has two spellings in this codebase — SHORT_PUT on the scan side, NAKED_PUT
#   on the Calculator/rescue side — and BOTH read the [structures.SHORT_PUT]
#   table below, so they cannot be given different exit rules. A
#   [structures.NAKED_PUT] table would look authoritative and be ignored.
#
#   Two keys exist only here, with no [stops] counterpart:
#     loss_rules  false = no money stop, no time stop, no delta stop.
#     manage_dte  close a PROFITABLE position at or below this DTE. A LOSING one
#                 is HELD — closing it there would be the loss-side stop under
#                 another name. Unset = off.
# ─────────────────────────────────────────────────────────────────────────────

# The Income Window's cash-secured put (both spellings).
#
# No loss-side rule, because each one is INVERTED here rather than merely
# unproven: a rising short delta and a shrinking DTE are the signs that
# assignment is becoming likely, and taking the shares is the wheel's PLAN —
# it is why equity_lots and _assign_shares exist.
[structures.SHORT_PUT]
loss_rules = false
manage_dte = 21
# tp_frac is inherited (0.50). TradingBlock takes ~90% here, but pairs it with
# rolling straight into the next ~45-DTE cycle, which this app cannot do for a
# single leg — so 0.90 alone would just mean holding ~20 more days for the last
# 40 points of a small credit. Set `tp_frac = 0.90` to try it anyway.

# The Income Window's covered call against a held lot.
#
# No loss-side rule for a stronger reason still: a covered call losing 2x its
# credit IS the stock rallying, and the shares hold that gain. ⚠ This app prices
# no bare share, so a covered call's unrealized_pnl covers the OPTION LEG ONLY —
# any money stop read off it is measuring half the position. Published
# covered-call research also finds stops produce more losers, not fewer.
[structures.COVERED_CALL]
loss_rules = false
manage_dte = 21
# TradingBlock takes ~95% here; same reasoning as above. `tp_frac = 0.95`.

[rescue]
# Escalation bands the at-risk board owns ALONE. The four it shares with [stops]
# (delta_critical, delta_drift, money_tested_mult, dte_urgent) are deliberately
# absent — they are derived, so they cannot drift.
delta_warn           = 0.30
money_warn_mult      = 1.0      # x entry credit, as a loss
money_critical_mult  = 3.0
dte_manage           = 21
proximity_watch_pct  = 0.03     # underlying within 3% of the short strike
proximity_tested_pct = 0.01
