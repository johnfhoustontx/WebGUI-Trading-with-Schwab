# The /ES and /NQ 0-DTE chain feed for Dealer Positioning (design:
# docs/plans/2026-10-31-futures-0dte-chain-feed-design.md).
# Read through shared/futures_chain_config.py by the capture on the PC, by
# options_svc (the ingest) and by the page. Nothing here reaches Schwab: the
# chains come from ThinkorSwim.

[capture]
# Seconds between snapshots. One value: nothing else assumes a cadence.
interval_sec = 120
# After a boundary with a miss (an instrument left out, a failed send, or work that ran
# past the interval) the capture drops to this cadence, and returns to interval_sec
# after this many clean captures in a row. Each session starts at interval_sec. A value
# at or below interval_sec is no fallback. The page reads a gap this long as captures
# being slower, not as an outage.
fallback_interval_sec = 300
fallback_clean_captures = 3
# The server drops a snapshot older than this, so a backlog never replays as
# current.
max_age_sec = 900
# The page labels a symbol stale when its newest snapshot is older than this
# during the session. A little over two of the slower intervals (the fallback's).
stale_after_sec = 660
# A snapshot stamped further ahead than this is refused (a clock that is wrong).
max_future_skew_sec = 30
# A capture reading fewer contracts than this share of the most read lately is
# not used. The PC measures against the most its ladder has read, and rewrites the
# ladder; the server against the capture before it, and refuses it as half filled.
# It is NOT a share of the contracts tried: /NQ's spacing is uneven, so a healthy
# chain lists far fewer than it tries.
min_fill_fraction = 0.8
# The floor against the contracts tried, for a first read with nothing to compare
# with: below it the sheet is not filled, or ThinkorSwim is logged out. Measured
# with the market closed on 2026-10-31: /ES read 306 of 306 tried, /NQ 416 of 572
# (0.73). Low, so a thinner chain than that still passes.
min_read_fraction = 0.25
# This many captures in a row with the future's price and the volume and open
# interest all unchanged is a frozen feed and is reported: a live future does
# not hold one price for minutes.
frozen_repeats = 3
# The history is stored one row per capture; the page draws one column per row
# and repeats a row to this step, up to one interval (the fallback's, so a slower
# stretch keeps its width in time). At the interval itself each column is a real
# capture and only a slower stretch is repeated. A lower step repeats rows and
# makes a heavier page: every repaint at 794 columns blocked the browser 4.5 s,
# past NiceGUI's 2 s ping (measured 2026-10-31). Choose a step that divides
# interval_sec, or the columns are unevenly spaced. Above the interval it reads as
# the interval: rows are never further apart than captures are.
fill_step_sec = 120
# Two captures further apart than this have an outage between them, drawn blank.
# Above the interval because a capture can be a minute late: rows are floored to
# the minute and a read can cross one, giving gaps of 240 and then 360. This is
# stated at an interval of 300 and scales with the slower of interval_sec and
# fallback_interval_sec, so 450 is one and a half of those: 180 at 120 with no
# fallback, 900 at 600. A value that works out below that interval reads as it.
outage_after_sec = 450
# The most blank columns one jump can add.
max_outage_columns = 288
# Between sessions the by-strike charts show the last capture taken at least this
# many minutes before expiry, so the last hour's gamma spike is not left on screen.
frozen_before_expiry_min = 60
# The phone alert for a stopped capture repeats at most this often.
alert_repeat_min = 240
# A snapshot larger than this is refused.
max_snapshot_kb = 512
# How long the feed waits for gex_history.db when another writer holds it. Its own
# thread can wait; past this the capture is refused and the reason says so.
store_busy_wait_sec = 30
# The put-call check looks at this many strikes, nearest the future's price
# first, for a call and a put that both have a mark. Not wider: far strikes
# quote wide.
parity_strikes = 5
# The rest are the PC's own, and reach it in the plan. How long a sheet's count of
# filled cells must hold before it is called filled: Excel hands ThinkorSwim's
# values over in batches about 2 seconds apart, so longer than two of them.
fill_settle_sec = 5
# The most it waits. A listed contract can stay N/A for good.
fill_wait_max_sec = 20
# Where the capture looks for a series: round strikes this many strike steps
# apart, this many each side of the price. A series can read N/A at one strike and
# resolve at another.
probe_round_steps = 10
probe_reach = 3
# The ladder is rewritten once the price has moved this share of the way to its
# end, because the walls and the flip see only the strikes captured.
recentre_share = 0.5
# A hung ssh is killed after this many seconds: the next capture matters more.
ssh_timeout_sec = 60
# After a failed plan fetch the first retry waits this long, doubling up to the
# second value. Many ssh connections in a few minutes have shut the operator out.
no_plan_retry_sec = 60
plan_retry_max_sec = 900
# No sign of life from the capture's loop for this long and its Excel is stopped,
# which frees the loop to start another. Longer than any honest stretch of work:
# that is at most one workbook save or one whole ssh.
hang_limit_sec = 600
# Stopping that Excel should make the loop's stuck call throw. With still no sign of
# life this long after the stop, the capture ends itself, and its scheduled task's
# repeating trigger starts it again. It covers restarting Excel, three tries at most.
hang_exit_after_sec = 240
# Whether /ES and /NQ are offered in the Dealer Positioning symbol list. The
# feed ships off the list; the operator decides when it joins.
show_in_dropdown = false

[session]
# One session is one expiry, and these are the hours it is captured, Central time.
# A start before the expiry's time is on the expiry's own date. A start at or after
# it is the evening before: "17:00" captures the whole futures session (23x5).
# Weekends are not modelled, and a holiday is found by the contracts not returning
# data.
open_ct = "06:00"
close_ct = "15:00"

[flip]
# How the gamma flip is found for /ES and /NQ. "cumulative": where the running total
# of net gamma, summed up the strikes from the lowest captured, changes sign.
# "per_strike": where one strike's net gamma changes sign against the next, the rule
# every other symbol uses. Measured on 2 November 2026 (06:01 to 06:12 Central), the
# per-strike flip jumped between captures two minutes apart (/ES 7641.65, none,
# 7641.81, 7641.77, 7775.24, none; /NQ between 28609 and 29133), because net gamma
# near the future was small and changed sign from strike to strike. The cumulative
# flip held at /ES 7656.7 to 7657.0 and /NQ 28793 to 28797. Changing it applies to
# captures from then on; stored rows keep the flip they were written with.
rule = "cumulative"
# Only crossings within this percent of the future's price are considered, the
# nearest winning.
band_pct = 3.0

[instruments.ES]
# The internal name passes the app's ticker rule; the page shows the label.
symbol = "FOP.ES"
label = "/ES"
# Dollars a point, from the contract's own description.
multiplier = 50
exchange = "XCME"
# Points between the strikes the capture tries.
strike_step = 5
# How far each side of the future the capture reaches, in percent of its price.
strike_width_pct = 5
# A call minus a put at the money should land on the future; further apart than
# this, in points, stops the snapshot.
parity_limit_pts = 15
# Series names, before the month code and the two-digit year. {w} is the week of
# the month, 1 to 5. Monday to Thursday, then Friday, month-end and quarterly.
weekday_roots = ["E{w}A", "E{w}B", "E{w}C", "E{w}D"]
friday_root = "EW{w}"
eom_root = "EW"
quarterly_root = "ES"

[instruments.NQ]
symbol = "FOP.NQ"
label = "/NQ"
multiplier = 20
exchange = "XCME"
strike_step = 10
strike_width_pct = 5
parity_limit_pts = 60
weekday_roots = ["Q{w}A", "Q{w}B", "Q{w}C", "Q{w}D"]
friday_root = "QN{w}"
eom_root = "QNE"
quarterly_root = "NQ"
