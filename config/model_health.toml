# Model Health: how the app's stated chances are scored each night
# (services/options_svc/model_health.py, the More -> Model Health page).
# It only reports: nothing here changes a chance, a rule or another page.
# Design: docs/plans/2026-11-14-model-health-design.md

# false skips the nightly step at the end of the 16:20 scalp job. The page's
# Recompute button still works.
enabled = true

# A model scored on fewer days than this reads "Too few days" rather than a
# verdict.
min_days = 20

# Drift: the last this-many sessions are compared with the sessions before them...
recent_sessions = 5
# ...and with fewer than this many earlier sessions there is too little history.
min_reference_sessions = 8

# Drift bands on the population stability index: under psi_moved is steady, up
# to psi_shifted is moved, above it is shifted.
psi_moved = 0.10
psi_shifted = 0.25

# A move is flagged only when it is also unlikely by chance: the recent sessions
# are swapped with whole earlier sessions this many times, and the input is
# flagged only when fewer than drift_p of the swaps moved as far.
drift_permutations = 200
drift_p = 0.05

# Resamples of whole days for the 95% interval on the Brier difference.
bootstrap_draws = 2000

# ── The range forecast (shadow; docs/plans/2026-11-14-range-forecast-design.md)
# Scored each night with the rest of Model Health: how far each symbol still
# travels (high minus low) over each horizon, forecast at each mark from bars
# already closed, against recent realised volatility and the implied move.
[range]
# false leaves the Range forecast table empty.
enabled = true
# The minutes ahead forecast; 0 is the rest of the session.
horizons_min = [30, 60, 0]
# The first and last forecast time (Central), and the gap between them.
first = "08:45"
last = "14:30"
step_min = 15
# Days a fit needs before it forecasts, and scored days before a verdict.
min_train_days = 40
min_days = 40
# Ridge penalty on the standardised inputs (0 is plain least squares).
ridge = 1.0
# The smallest variance or range a logarithm reads, so a flat stretch is finite.
floor = 1e-8
# Earlier sessions averaged for "volume so far against its usual level".
volume_sessions = 20

# Each symbol forecast, and the volatility index read as its implied move.
[range.symbols]
SPY = "$VIX"
QQQ = "$VXN"
"$SPX" = "$VIX"

# A symbol whose bars carry no volume reads this symbol's volume instead.
[range.volume_from]
"$SPX" = "SPY"
