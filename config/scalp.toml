# Opening Scalp (docs/plans/2026-10-18-opening-scalp-design.md).
#
# The page measures how often a 0DTE scalp entered after the first five minutes
# of the regular session wins, for each symbol below. Read by shared/scalp_config.py
# with the mtime-cached loader, so a saved change applies with no restart. The
# operator's changes go in config/local/scalp.toml (Settings -> Configuration),
# never here. The call and bar slot TIMES live in config/sessions.toml.
#
# A per-symbol table is keyed by the symbol in quotes ("$SPX" has a dollar sign).
# A symbol with no entry reads as the SPY-like default (a 1.00 strike step and
# width); an input with no entry is absent, never zero.

[universe]
# The symbols the page calls. Each needs entries in the tables below.
symbols = ["$SPX", "SPY", "QQQ"]

[bars]
# Every symbol whose bars are stored: the symbols above, the inputs they read
# (futures, sector ETFs, volatility index). Any input named under [inputs] but
# missing here is added when the list is read, so it is always fetched.
symbols = ["$SPX", "SPY", "QQQ", "/ES", "/NQ", "IGV", "SMH", "EWY", "XLE", "XLK", "XLV", "$VIX", "$VXN"]

[strike_step]
# The gap between listed strikes, in dollars: the scalp's strike is the nearest
# multiple of this to the open.
"$SPX" = 5
SPY = 1
QQQ = 1

[width]
# Credit-spread width in dollars (the exit rule's alternative leg).
"$SPX" = 5
SPY = 1
QQQ = 1

[inputs."$SPX"]
# What the direction call reads for this symbol: the overnight futures, the
# sector ETFs that lead it, and the volatility index.
futures = "/ES"
etfs = ["XLE", "XLK", "XLV"]
vol = "$VIX"

[inputs.SPY]
futures = "/ES"
etfs = ["XLE", "XLK", "XLV"]
vol = "$VIX"

[inputs.QQQ]
futures = "/NQ"
etfs = ["IGV", "SMH", "EWY", "XLK"]
vol = "$VXN"

[trade]
# How far out of the money the long option is, in strikes (0 = at the money).
otm_steps = 0
# Close the scalp when the option has gained this percent of its entry price.
target_pct = 50
# Close it when it has lost this percent of its entry price.
stop_pct = 50
# Close it this many minutes after entry whatever the price is.
time_stop_min = 60
# Multiplies the implied volatility the model prices with (1.0 = as observed).
iv_scale = 1.0
# An entry premium below this many dollars per share is not tradeable and the
# trade is skipped, not scored.
min_premium = 0.05
# Strikes either side of the open kept when the morning's chain is saved.
chain_strikes = 10

[direction]
# Returns (percent) smaller than this count as flat, not up or down.
dead_zone_pct = 0.05
# A 0..1 position (where a reading sits in its range) within this of the middle
# counts as neutral.
dead_zone_frac = 0.1
# The same flat band for the first-five-minutes move, percent.
open_dead_zone_pct = 0.03
# Two cut points, in order, in (0,1): the share of inputs agreeing with the call
# that splits the confidence buckets low / medium / high.
buckets = [0.4, 0.7]

[study]
# The IV multipliers the study tries, to show how much the answer leans on the
# volatility assumption. Positive numbers.
iv_scales = [0.8, 1.0, 1.25, 1.5]
# The fewest scored mornings a bucket needs before it can be marked as an edge.
# It gates only that verdict: the page shows every bucket's rate with its count.
min_samples = 20
# Trading days the scorecard looks back over.
scorecard_days = 20

[news]
# Headlines shown beside each morning call.
items = 5

[context]
# Shown beside each morning call and labelled as NOT in the probability: the
# link to the premarket and prior-close reports.
report_url = "https://neuralstrike.co/report.html"

[intraday]
# The intraday calls (docs/plans/2026-10-20-scalp-intraday-calls-design.md): a new
# call every interval_min minutes from start to end, Central time. A slot is
# named by its clock time ("08:51"). Each is entered on the last 5-minute bar
# that has closed (08:51 enters on the 08:50 bar). The first call may not be
# before 08:45, no call may fall at 08:36 (the morning call's own time), and the
# last call's entry + the time stop under [trade] may not pass the 15:00 close;
# a schedule that breaks any of these reads as these defaults whole.
start = "08:51"
end = "13:51"
interval_min = 15
# How many minutes late a slot may still fire.
grace_min = 5
# Returns (percent) smaller than this count as flat for the intraday move.
dead_zone_pct = 0.03
# The share (0..1) of the big ten that must lean one way to count as breadth.
breadth_agree = 0.6
# The share (0 up to, not including, 1) of the session's 5-minute bars, 08:30 to
# the entry bar, that may be missing before the side of VWAP is left out.
vwap_max_missing = 0.25
# How much better (lower) than the base rate's a bucket's walk-forward Brier score
# must be, at EVERY volatility multiplier, before an intraday cell counts as an
# edge (0 up to, not including, 0.25). 0.005 is about a 7-point win-rate
# difference at a win rate near 50%: below it, a "better" bucket is a near-tie
# with the base rate. Declared before the study was read; the 08:36 study does
# not use it.
min_brier_margin = 0.005
# Sessions of calls a group needs before it can be promoted.
promotion_sessions = 40
# Sessions that close early (YYYY-MM-DD), and the time they close, Central. On
# such a day no call is made whose entry + the time stop would pass the early
# close, and the study leaves those slots out. Add next year's half days here.
early_close_days = ["2026-11-27", "2026-12-24"]
early_close_time = "12:00"

[intraday.blocks.morning]
# The three parts of the day the study keeps apart. Each slot belongs to exactly
# one block; blocks must not overlap. A bad table reads as these defaults whole.
start = "08:51"
end = "09:51"

[intraday.blocks.midday]
start = "10:06"
end = "12:21"

[intraday.blocks.afternoon]
start = "12:36"
end = "13:51"

[confirm]
# The confirmation scored beside each intraday call (it never changes the call).
# Minutes of flow alerts looked back over.
flow_window_min = 30
# How many more alerts one side needs than the other to lean.
flow_margin = 2
# The share (0..1) of total net premium one side must lead by to lean.
netprem_margin = 0.1
# The share of an option alert's labelled bought + sold volume that must be on
# one side (above 0.5, up to 1) before the alert counts as directional.
sides_majority = 0.6
# How many of the big ten must have a usable reading before a breadth is read:
# a usable wall for the dealer read's breadth of room (below this it goes by the
# symbol's own room alone), and a move outside the dead zone for the intraday
# price breadth.
breadth_min_members = 5
# How many of the four sources must give a reading (1 to 4) before they are put
# in one word (Confirms / Mixed / Contradicts): one source alone is not a
# confirmation.
min_sources = 2
# A confirming reading older than this many minutes is treated as absent.
max_age_min = 5
# Contradicts at or below the first, Confirms at or above the second, on the
# weighted -1..1 score; between them is Mixed.
cuts = [-0.34, 0.34]

[confirm.weights]
# What each input counts for in that score. 0 leaves an input out.
flow = 1.0
netprem = 1.0
dealer = 1.0
sentiment = 0.5

[prob]
# The fitted chance of target shown beside every call (design
# docs/plans/2026-10-22-scalp-weighted-probability-design.md). Each factor is
# scaled, pushes the chance up or down by a weight, and the weights are refitted
# weekly from the stored history. Until a factor has history its weight is the
# ASSUMED prior below.
# Bars in the moving average whose slope is a factor, and the bars the slope is
# measured over.
ema_period = 20
slope_bars = 3
# Bars in the RSI factor.
rsi_period = 14
# The bar sizes, in minutes, the slope and RSI factors are read on: whole
# multiples of 5, ascending.
timeframes = [5, 15, 60]
# Sessions of bars read before an entry to warm up the EMA and RSI.
lookback_sessions = 10
# Caps, so one extreme reading cannot dominate: a scaled factor, the room to the
# nearest wall divided by the target's points, and the flow alert count.
cap = 3.0
room_cap = 3.0
flow_cap = 3
# The refit's honesty check: weeks of history before the walk-forward test is
# run, and how far below the usual rate's Brier score a fit must land for the
# page's "beats the usual rate on unseen days" line to read yes (0 up to, not
# including, 0.25). It decides only that line: the chance is shown either way.
min_train_weeks = 8
min_brier_margin = 0.005
# The weekday of the weekly refit, 0 Monday to 6 Sunday (5 Saturday). The time is
# [slots.scalp_prob] in config/sessions.toml.
refit_weekday = 5
# Show the fitted chance on the page.
show = true
# A factor's weight is shown as "assumed" while less than this share of it was
# learned from data (the data's share of the weight's posterior precision;
# the rest is the starting assumption). Strictly between 0 and 1.
assumed_share = 0.5

[prob.priors]
# The ASSUMED weight of each factor before its history has moved it: a positive
# number pushes the chance up when the factor agrees with the call, 0 assumes no
# push. These are starting guesses, not measurements; the weekly refit replaces
# them as each factor's history grows.
slope_5 = 0.15
slope_15 = 0.10
slope_60 = 0.05
rsi_5 = 0.10
rsi_15 = 0.07
rsi_60 = 0.04
room = 0.15
breadth_room = 0.05
flip_side = 0.0
netprem = 0.10
flow = 0.10
sentiment = 0.05

[prob.prior_sd]
# How tightly a prior holds, as the standard deviation of the Gaussian the weight
# is pulled toward (smaller holds harder). Both above 0. wide: the factors with
# ~180 days of history (the price inputs, slopes, momentum, time of day), so
# their history decides them; tight: the thin sources (dealer read, net premium,
# flow, sentiment), so they stay near their assumed value.
wide = 1.0
tight = 0.10

[regime]
# The declared net-gamma regime study of the 15-minute calls (design
# docs/plans/2026-10-25-scalp-gamma-regime-study-design.md). Every value below was
# DECLARED on 2026-10-25, before any outcome of the test window was read. Changing
# one after reading the result is a new study, declared and run as one.
# The first session of the test window (YYYY-MM-DD). Sessions before it are never counted.
start_day = "2026-10-21"
# Usable sessions the afternoon needs graded before the study is read, once.
min_sessions = 40
# The significance level of each block's one-sided permutation test.
alpha = 0.05
# The smallest gap, in percentage points, between the negative and positive regimes' win rates that counts.
min_effect_pp = 5.0
# The fixed order the blocks are tested in; a block is tested only if the one before it passed.
order = ["afternoon", "midday", "morning"]
# Random relabelings the permutation test draws.
permutations = 10000
# The permutation test's random seed, fixed so a re-run gives the same p-value.
seed = 20261025
# The share of slots, backfilled against live, whose net-GEX sign must agree before the study runs.
min_sign_agreement = 0.95
# Test-window sessions that agreement check must cover.
agree_min_sessions = 5
