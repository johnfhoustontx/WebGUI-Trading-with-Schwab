# ─────────────────────────────────────────────────────────────────────────────
# config/marketdata.toml — THE PROXY'S LOCAL MARKET-DATA STORE
#
#   The proxy keeps what it fetches from Schwab and answers later requests from
#   that copy when the copy is fresh and covers the request. Read on every
#   request, so a change here needs NO restart.
#
#   Design: docs/plans/2026-10-03-market-data-store-design.md
# ─────────────────────────────────────────────────────────────────────────────

# "off"    — the proxy passes every request to Schwab, as it did before the store.
# "shadow" — every request still goes to Schwab; the store is filled and the proxy
#            counts what it WOULD have answered. Costs no extra calls.
# "on"     — repeat requests are answered locally.
# Anything else reads as "off".
mode = "shadow"

[chains]
enabled = true
max_age_sec = 45                  # while any session is open
closed_max_age_sec = 1800         # while every session is closed
max_entries = 400
shadow_compare_max_age_sec = 120  # shadow only: how old an entry may be and still be compared
# When a request just misses, the proxy refetches a wider window it already holds
# for that symbol and cuts the answer from it, so the holder's next request hits.
# This is the longest held window it will refetch that way, in days. It should
# EQUAL the collector's window, 7 days: any higher and the collector's own
# request is turned into a longer window something else holds (the 10-day term
# structure, a Strategy Finder scan).
wide_refetch_max_days = 7

[quotes]
enabled = true
max_age_sec = 5                   # the dashboard poll sends its own 1
max_symbols = 5000                # most symbols kept; the oldest are dropped past it

[bars]
enabled = true
# How the bar for the session in progress is handled, daily series only.
#   "ttl"   — re-serve the last fetched series for session_ttl_sec.
#   "quote" — build today's bar from the live quote. Switch to this only after the
#             shadow counts show the two agree (shadow_bar_match). A symbol with
#             no usable quote is handled as in "ttl".
today_bar = "ttl"
session_ttl_sec = 1740
today_quote_max_age_sec = 120
settle_min = 10                   # minutes after the close before the settled refetch
max_entries = 4000                # most series kept; the oldest are dropped past it

[scan]
# The autoscan fetches ONE today -> +45 day chain per symbol and cuts its three
# windows from it, instead of three fetches.
wide_fetch = false
wide_fetch_exclude = ["$SPX", "$NDX", "SPY", "QQQ"]   # too large for one fetch

[collection]
# Minutes between REAL chain fetches for symbols that are collected only because
# they are on the watchlist. 1 = every minute (the behaviour before this file).
# Works only while mode = "on" and chains.enabled; otherwise every fetch is real.
# Use 3 or 5. The Opportunity Board's flow acceleration reads a 15-minute window,
# and an interval that does not divide 15 puts an uneven number of real fetches
# in each window. Above 5 is read as 5.
tail_interval_min = 1
# This one number does TWO jobs:
#   1. an answer older than this is treated as carried forward (re-priced at the
#      live quote, kept from the volume detectors);
#   2. while the store is on (mode = "on" and chains.enabled), it is the age
#      limit the collector sends with every chain request for a symbol due a
#      real fetch: every symbol when the interval is 1. Without it the proxy's
#      own limit would apply, 1,800 seconds while every session is closed.
# So it must stay under one poll minute less carry_slack_sec below: at most 30
# as shipped. Above that, a one-minute symbol is regularly answered with the
# PREVIOUS minute's chain and treated as new. A higher value is read as that
# ceiling.
fresh_max_age_sec = 20
# The most a carried contract's gamma may grow over Schwab's own value between
# real fetches. Near the close on an expiration day the model's ratio for a
# strike the price walks onto runs into the thousands; this caps it. Below 1 is
# read as 10.
max_gamma_ratio = 10.0
# Seconds added to the interval when the collector asks the proxy for a STORED
# chain (3 minutes + 30 = 210), so a chain fetched a little late in its own
# minute is still inside the limit.
carry_slack_sec = 30

[tracker]
# The proxy's paper-trade tracker (/track and its 30-second reconcile). A trade
# it could not start tracking is tried again after 30 seconds, then 60, 120 ...
# up to these limits. A trade it will never follow (a debit structure, a missing
# strike or credit) is not tried again at all, and costs no Schwab call.
retry_max_sec = 1800              # a strike not in the chain, or an unexpected fault
fetch_retry_max_sec = 300         # Schwab did not send the chain: resume soon after
