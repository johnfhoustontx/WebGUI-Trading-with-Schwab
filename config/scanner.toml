# ─────────────────────────────────────────────────────────────────────────────
# config/scanner.toml — WHETHER A SIGNAL FIRES AT ALL
#
#   The selection floors. Edit + restart options_svc. Anything omitted falls back
#   to the built-in default in shared/scanner_config.py.
#
#   ⚠ These are the knobs behind the most common "why do I never see signals on
#     $SPX / SPY / QQQ?" question. It is not a bug: index IV rank frequently sits
#     below [iv_rank], and index credits below [credit]. Loosening those two is
#     how you see index signals — and how you start selling cheap premium, which
#     is what the 2026-06-11 quality retune raised them to stop.
#
#   Sibling file: config/flow_alerts.toml holds the ALERT thresholds (what gets
#   pushed once a signal exists). This file decides what exists.
# ─────────────────────────────────────────────────────────────────────────────

[iv_rank]
# Hard pre-filter: reject a SHORT-PREMIUM candidate below this IV Rank. Selling
# cheap premium is destructive, so this binds only on low-IV days — most days sit
# well above. 2026-06-11 quality retune raised 0-DTE 25 -> 35 and SWING 20 -> 30.
#
# ⚠ Measured over 910 closed captured signals on prod (2026-09-12), these levels
#   sit BELOW where the edge starts. Mean R by entry IV rank: 0-39 -0.149 |
#   40-44 -0.151 | 45-49 +0.015 | 55-69 +0.239 | 85-100 +0.266, and win rate
#   goes 24% -> 81% across the same span. Raising all three to 45 is the measured
#   optimum on total R (it cuts 94 of 910 trades worth -14.1R and keeps +199.9R);
#   55 gives that gain back, so tighter is NOT better past ~50. Left at 35/30
#   because a ~10% cut to every signal the app emits is an operator decision, not
#   a drive-by. See docs/plans/2026-09-12-volatility-gate-design.md, which also
#   records the two honest weaknesses (ORCL + UAL are 75 of the 139 trades below
#   50, and the 5-point grid is not monotone).
#
# ⚠ A key added HERE alone is silently dropped — shared/scanner_config.py's
#   min_iv_rank() is closed over its own DEFAULTS. Add a trade type to both.
"0-DTE" = 35
SWING   = 30
# The 30-45 DTE income window, ungated until 2026-09-12 (gap assessment B2).
# 30 matches SWING on purpose: the same rule the rest of the app already lives
# under, rather than a third number. Measured before shipping it, the live board
# offered IREN PCS at IV rank 0.1 as its TOP-ranked idea and CRWV at 15.3 — this
# floor cuts both and keeps the two SPY rows at 34.9.
INCOME  = 30

[iv_rank_ceiling]
# The mirror: reject a LONG-PREMIUM candidate ABOVE this IV Rank — don't buy
# expensive volatility. 0 means OFF, and every entry ships off.
#
# Not a level this repo can justify yet: signals.db holds only PCS, CCS and IC, so
# there is NO long-premium outcome data to set one from, and switching on a gate
# that refuses trades without measuring it is the mistake this audit keeps
# catching. When you do set one, 65 is the natural value — it is not a new number
# but strategy_scoring.infer_market_view's own "high" boundary, the mirror of the
# floor's 35 being its "low" one.
"0-DTE" = 0
SWING   = 0
INCOME  = 0

[credit]
# Minimum credit as a fraction of spread width, adaptive by VIX regime: when IV
# is cheap a thinner credit is acceptable because POP is high; when premium is
# rich, demand more of it.
swing = 0.12          # 1-15 DTE. Raised from 0.10 — short DTE leaves less recovery time.

[credit.zero_dte]
LOW      = 0.08
NORMAL   = 0.12
ELEVATED = 0.15
HIGH     = 0.20

[directional]
# A directionally-biased CREDIT spread (mode="DIRECTIONAL"): strikes closer to
# spot than the premium ranges, so they pay more and carry a higher floor.
min_credit_pct   = 0.20
max_risk_pct     = 0.02      # 2% account risk per directional trade
max_per_symbol_bucket = 2
pcs_delta = [-0.55, -0.30]   # short-delta band
ccs_delta = [0.30, 0.55]

[single_leg]
# LONG/SHORT calls & puts — NOT the same thing as [directional] above, which is a
# two-leg credit spread. Scored on strategy_scoring's Fit+Quality model, because
# the premium-seller's scoring.py cannot score a long call (it rewards positive
# theta and penalises long vega).
max_per_symbol = 8           # 4 structures x 2 windows (0-DTE + swing)
min_score      = 50.0
excluded_grades = ["Weak"]

[scores]
# Capture floor: a signal must reach this to be recorded at all.
capture_min = 58

# The INCOME window's own capture floor, and 0 is deliberate.
#
# The composite was tuned for the 0-DTE / swing credit-spread core, and the
# 30-45 DTE board scores well below it: measured on prod 2026-09-11, all five
# candidates came in at 50.2-57.0 and every one graded "Marginal". Sharing
# capture_min = 58 would therefore record NOTHING, every day, and the whole
# point of capturing this board (gap assessment C1) is to find out whether those
# marginal-looking trades actually work — which cannot be learned by refusing to
# write them down.
#
# 0 means "whatever the board offered", not "everything": income_scan already
# cuts below swing_min (50) service-side, so that cut is the real filter and
# restating it here would just be a second number to drift. Raise this once
# there is enough outcome data to say which score band is worth keeping.
capture_min_income = 0

# Index premium spreads in a mildly-negative GEX (trend-prone) regime need a
# higher bar than the capture floor. Below gex_strong_neg, index premium is
# skipped outright.
neg_gex_min   = 62
gex_strong_neg = -0.30

# Emission cut for the Strategy Finder (services/options_svc). Deliberately a
# SEPARATE knob from single_leg.min_score even though both read 50.0 today: they
# express different intents ("no low-scoring trades" vs "no gate-failing trades")
# and either may move alone.
swing_min = 50.0
