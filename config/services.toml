# ─────────────────────────────────────────────────────────────────────────────
# config/services.toml — limits every service shares
#
#   [age]    how old a queued command may be before it is refused. A page sends
#            a service a command through a queue. If the service was down, or
#            its queue is replayed after a restart, old commands arrive late.
#   [health] when a service reports itself as not healthy.
#   [stream_keep] how many commands each queue keeps after they have been run.
#
#   Edit a value here (or in Settings -> Configuration), then restart the
#   services. Two are exceptions, read each time they are used, so a change
#   applies to the next command with no restart: [stream_keep], and
#   [dead_letters] max_field_kb.
#   Anything you delete falls back to the default in shared/service_limits.py.
# ─────────────────────────────────────────────────────────────────────────────

[age]
# Commands that change a paper book, make a paid call or post in public: open or
# close a paper trade, reset the paper account, delete ledger rows, apply a
# Rescue adjustment, switch auto-close, run a Claude briefing, post to X. Older
# than this many seconds, the command is refused: the click is acting on prices
# and positions that have moved on.
side_effect_max_sec = 180

# Every other command on a service's own queue (a scan, a chart, a calculator
# request). Older than this, it is not a click someone is waiting for; it is the
# queue's history being replayed, and running it would spend Schwab calls for
# nobody. A few commands that only re-read a local store run at any age.
replay_max_sec = 900

[dead_letters]
# A command a service could not run (its handler failed, or it was stranded by a
# restart) is kept on a list so a person can see what was lost. Nothing trimmed
# that list until 2026-10-04. Each queue now keeps the newest this-many; the
# count shows on the service's System Status card.
keep = 200

# How much of one command is kept, in KB. The list is for a person to see what
# was lost, not a copy to run again, and a command can carry a whole document
# (a blog draft is up to 512 KB): kept whole, 200 of those were about 100 MB on
# one list. Text longer than this is cut here and marked
# "...[truncated, N bytes total]", and the entry is flagged "truncated".
# Every other command is a few hundred bytes and is kept exactly as it was.
# 1 to 4096. Read each time a command is kept, so a change needs no restart.
max_field_kb = 64

[stream_keep]
# A queue keeps its newest commands after they have been run, so a person can
# look back at what was asked. Each time a command is added the queue is cut
# back to about this many (Redis trims in blocks of up to 100 commands, so a
# queue of small commands can run up to about a hundred over). Until 2026-10-06
# this was 1000 for every queue, fixed in code. 1 to 100000.
default = 1000

# A queue named here keeps its own number instead of the default. The name is
# the Redis stream's, in quotes because of the colon.
#
# These two are small because each of their commands carries a WHOLE blog
# document, up to [limits] max_html_kb in config/blog.toml (512 KB as shipped):
# cmd:blog is the Blog page's uploads and its Publish, cmd:blog_inbox is drafts
# arriving from Claude Chat. A thousand documents would be about 500 MB of the
# server's memory in each queue; fifty is about 25 MB. A value here that cannot
# be read falls back to 50, not to the default above.
"cmd:blog" = 50
"cmd:blog_inbox" = 50

[pool]
# Threads each service keeps for its scheduled work (scans, the one-minute
# collection, refreshes). Each command queue has a thread of its own outside
# this pool, so a queue is read whatever the pool is doing. More threads let
# more scheduled jobs overlap; they do not raise the Schwab call rate, which
# the proxy limits. 2 to 256.
workers = 16

[health]
# Each service runs a scheduler loop that goes round every few seconds to two
# minutes. If the loop has not gone round for this many seconds, the service
# reports itself as NOT up: its card on System Status turns red, the rail's
# status badge counts it and the alert chime plays. The process answering its
# health check is not the same as the service doing its work. Keep this well
# above 120, the slowest loop's own interval.
tick_stale_sec = 600

# A scheduler that dies is restarted, up to ten times. Until 2026-10-04 that was
# ten for the life of the process, so ten unrelated faults a week apart left it
# stopped for good. A scheduler that has run this many seconds without dying
# gets the full ten back.
restart_reset_sec = 3600
