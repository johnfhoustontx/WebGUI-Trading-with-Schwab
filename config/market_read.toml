# The Desk's "Market read" scorecard. Six rows, each decided by rule from views the
# services already publish: Tailwind, Headwind, Neutral, or No reading when a row's
# inputs are missing or stale. No Schwab call and no Claude call.
# Read by the market service on every slot, so a change needs no restart.
# Design: docs/plans/2026-10-05-market-read-scorecard-design.md.
# Every threshold below is a STARTING GUESS; none has been measured against outcomes.

enabled = true           # compute and publish the scorecard
public = true            # show it on the public Desk; false = this app only
interval_min = 15        # a reading on every clock multiple of this, from the first one
                         # after the 08:30 CT open to the 15:00 close. 15 or 30.
stale_after_sec = 300    # an input view older than this makes its rows "No reading"

[direction]
move_pct = 0.25          # $SPX and $NDX both up (or both down) by at least this, in percent

[breadth]
strong_share = 0.60      # Tailwind when this share of the equity frames is advancing
weak_share = 0.40        # Headwind at or below this share

[structure]
symbols = ["SPY", "QQQ"] # read from the Opportunity Board's rows; they must agree
room_pct = 0.50          # Tailwind: above the flip with at least this much room to the ceiling
near_pct = 0.25          # Headwind: within this of the ceiling while dealers are long gamma

[volatility]
vix_move_pct = 1.0       # VIX up (on an up day) or down by at least this, in percent

[flow]
lean_pts = 5.0           # bought minus sold, in points of volume, pooled over flagged contracts.
                         # On 2026-10-05 the pooled lean on calls was under 2 points, so this
                         # row reads Neutral on most days. That is the reading, not a fault.
min_contracts = 10       # fewer flagged contracts than this is "No reading"
