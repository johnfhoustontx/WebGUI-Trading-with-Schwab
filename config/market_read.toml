# The Desk's "Market read" scorecard. Seven rows, each decided by rule from views the
# services publish: Tailwind, Headwind, Neutral, or No reading when a row's inputs are
# missing or stale. No Claude call, and no Schwab call except [volume]'s own fetch.
# Read by the market service on every poll, so a change needs no restart: a switch
# applies within seconds, a threshold at the next reading.
# Design: docs/plans/2026-10-05-market-read-scorecard-design.md.
# Every threshold below is a STARTING GUESS; none has been measured against outcomes.

enabled = true           # compute and publish the scorecard
public = true            # show it on the public Desk; false = this app only
interval_min = 15        # a reading on every clock multiple of this, from the first one
                         # after the 08:30 CT open to the 15:00 close. 15 or 30.
stale_after_sec = 300    # an input view older than this makes its rows "No reading"
dashboard_stale_after_sec = 60   # the same, for the Market Dashboard's tiles: they are
                         # republished every 3 seconds, so a minute old means the poll stopped
retry_sec = 30           # after a reading that failed to build, wait this long before retrying
glow_min = 5             # the Desk's Market read and Market report buttons glow for this many
                         # minutes after a new reading or report. 0 = never. Next reading.

[direction]
move_pct = 0.25          # $SPX and $NDX both up (or both down) by at least this, in percent

[breadth]
strong_share = 0.60      # Tailwind when this share of the equity frames is advancing
weak_share = 0.40        # Headwind at or below this share
min_tiles = 10           # fewer tiles with a price than this is "No reading": a quote outage
                         # that leaves one tile up would otherwise read as 100% advancing

[structure]
symbols = ["SPY", "QQQ"] # read from the Opportunity Board's rows; they must agree
room_pct = 0.50          # Tailwind: above the flip with at least this much room to the ceiling
near_pct = 0.25          # Headwind: within this of the ceiling while dealers are long gamma.
                         # Must be below room_pct, or both fall back to these defaults.
stale_after_sec = 150    # "No reading" when the GEX collector's last snapshot is older than
                         # this, or its age is unknown. The Desk's dealer panel uses the same limit.

[volatility]
vix_move_pct = 1.0       # VIX up (on an up day) or down by at least this, in percent

[flow]
lean_pts = 5.0           # bought minus sold, in points of volume, pooled over flagged contracts.
                         # On 2026-10-05 the pooled lean on calls was under 2 points, so this
                         # row reads Neutral on most days. That is the reading, not a fault.
min_contracts = 10       # fewer flagged contracts than this is "No reading"

[volume]
# Traded volume. Published as cache:market:volume for this scorecard's Volume row and
# for the daily market reports. Costs Schwab one bar series per symbol and one /quotes
# call per refresh. Design: docs/plans/2026-11-01-volume-in-read-and-reports-design.md.
enabled = true
symbols = ["SPY", "QQQ"] # read from five-minute bars; they must agree for the row to lean
sector_symbols = ["XLB", "XLC", "XLE", "XLF", "XLI", "XLK", "XLP", "XLRE", "XLU", "XLV", "XLY"]
                         # the share of dollars traded in rising sectors. A fact in the
                         # reports and the row's text; it decides no verdict.
baseline_sessions = 9    # "usual" is the median of this many sessions, by the same time of
                         # day. At most 9: Schwab serves ten days of bars, today included.
min_sessions = 5         # fewer usable sessions than this is "No reading"
min_bars = 2             # fewer finished bars today than this is "No reading". 2 is what
                         # the 08:45 reading and report have: the view of 08:41:30.
heavy_ratio = 1.2        # volume so far at or above this many times usual is heavy
light_ratio = 0.8        # at or below this is light. Must be below heavy_ratio.
                         # Over 149 sessions to 2026-10-30, SPY read heavy at about 20% of
                         # readings and light at about 20%.
up_share_strong = 0.55   # Tailwind: heavy, and at least this share of the volume in rising bars
up_share_weak = 0.45     # Headwind: heavy, and at most this share. Must be below the strong
                         # share. With both symbols agreeing the row left Neutral on about
                         # 5% of readings. It reads what has happened: measured, heavy volume
                         # went with a wider range later and did NOT predict direction.
min_sectors = 8          # fewer usable sector funds than this and the share is left out
refresh_min = 5          # fetch once per this many minutes in the session
settle_sec = 90          # ...this long after the mark, so the bar has closed. At least 60:
                         # Schwab refuses calls in the minute after the hour and half hour.
stale_after_sec = 600    # the Volume row is "No reading" when the view is older than this
