# ─────────────────────────────────────────────────────────────────────────────
# config/paper.toml — the paper books' PER-TRADE loss caps
#
#   Edit a value here (or in Settings -> Configuration), restart options_svc.
#   Anything you delete falls back to the built-in default in
#   shared/paper_limits.py. A zero, negative or non-number value also falls back:
#   a cap of zero would refuse every trade.
# ─────────────────────────────────────────────────────────────────────────────

[risk]
# The automatic Paper Account's largest loss on one trade. ALSO the budget the
# scanner's width search sizes against: a width whose one contract would lose
# more than this is never emitted, so lowering it hides wide spreads on
# high-priced names. Was $250 until 2026-09-22.
max_risk_per_trade = 750.0

# The Paper Ledger's largest loss on one trade — the book the Paper button opens
# into. The Strategy Finder and the Income Window size their credit spreads
# against this cap, since that is where their trades are booked.
ledger_max_risk_per_trade = 750.0

[marks]
# A leg with NO BID still gets a mark when its offer is at or under this many
# dollars a share. That is a nearly worthless option - the long leg of a spread
# that has won, quoted 0.00 x 0.05 near expiry - and without a mark the position
# gets no target and no profit lock exactly when it has earned them. A leg with
# no bid and a LARGER offer (0.00 x 1.20) is a broken quote: the position is
# left unmarked for that cycle, as before. 0 = a leg with no bid is never
# marked. Read at each mark, so a change needs no restart.
zero_bid_max_ask = 0.25
# How old a chain a position MARK may be priced from, in seconds, when the proxy
# answers from its own store (config/marketdata.toml). An entry or a close is
# always priced from a chain fetched at that moment, whatever this says.
chain_max_age_sec = 45

[idea_trades]
# Every hourly trade idea that is POSTED is also booked into the Paper Ledger
# (options_svc/idea_ledger.py), so the ideas are measured by the same books as
# every other trade. A bad value in this table reads as the shipped default.
#
# Book the ideas at all. false stops new bookings; open ones are still marked and
# settled. Must be true or false.
enabled = true
# Contracts per idea (a whole number, 1 or more).
quantity = 1
# Minutes between marks of the open idea trades (1 to 60).
mark_interval_min = 5
# A debit idea is stopped out when it has lost this fraction of what it cost
# (above 0, up to 1). 0.60 = a 60% loss of the debit paid.
debit_stop_frac = 0.60
# The weekly review calls a winner "clean" when its worst drawdown before the win
# stayed within this percent of the risk (above 0, up to 100).
clean_mae_pct = 25.0
# The fewest booked ideas in a group before the weekly review will draw any
# conclusion from it (1 or more).
min_n = 5
# The Claude model the weekly review's written judgment uses (a tier name, never
# a version).
review_model = "sonnet"

[daily_condor]
# One mechanical 0-DTE iron condor, booked into the Paper Ledger every trading
# morning at [slots.daily_condor] (config/sessions.toml, 08:45 CT) by
# options_svc/daily_condor.py. It bypasses EVERY risk cap: it is a measurement.
# It is checked on the trade ideas' mark cycle ([idea_trades] mark_interval_min)
# and otherwise settled at the close. A bad value reads as the shipped default.
#
# Book it at all. false stops new bookings; an open one is still marked and
# settled. Must be true or false.
enabled = true
# The underlying. Its same-day expiry is traded.
symbol = "SPY"
# Each short leg is the strike whose delta is nearest this (absolute, 0 to 0.5).
short_delta = 0.15
# Dollars between each short strike and its long wing (above 0, up to 100).
width = 5.0
# The stop: closed when the LOSS reaches this multiple of the credit. 2.0 with
# $1.00 taken in closes when buying it back costs $3.00 (above 0, up to 20).
stop_mult = 2.0
# Condors per day (a whole number, 1 or more).
quantity = 1
