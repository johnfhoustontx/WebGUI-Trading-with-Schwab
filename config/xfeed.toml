# X accounts feed - how xfeed_svc polls the FxEmbed API and what the page shows.
# Read through services/xfeed_svc/config.py (built-in defaults <- this file <-
# config/local/xfeed.toml). Edit here (or in Settings -> Configuration). The
# poller re-reads this file every tick, so a saved change applies with no restart -
# except [fxembed]: the FxEmbed client is built once at start, so those keys need
# an xfeed_svc restart.
# A missing key or a bad value reads as the shipped value below, never as an error.

[fxembed]
base_url = "https://api.fxtwitter.com"
user_agent = "neuralstrike-xfeed/1.0"
timeout_s = 15
not_found_retries = 3
retry_delay_s = 0.5

[poller]
interval_s = 60          # minimum 30, enforced in code
account_gap_s = 1.0
page_gap_s = 1.0
max_pages = 25
backoff_s = [60, 120, 300]
not_found_limit = 3
live_slack_min = 15      # OLD_POST_SLACK
recent_factor = 3        # "live" needs last_ok within 3 intervals
tick_s = 5

[views]
latest_rows = 300
query_limit_max = 1000
top_tickers = 10
answer_ttl_s = 120
group_name_max = 30

[page]
new_highlight_s = 60
answer_poll_s = 0.25
answer_timeout_s = 20

# The PUBLIC site's X Feed (live.neuralstrike.co/x-feed). The service publishes a
# separate pair of views holding only these accounts' posts, so the public page
# can never show an account left out here. The private /news/x page is unaffected.
[public]
enabled = true           # false: the public page shows no posts at all
groups = ["*"]           # "*" = every watched account; or group names, e.g. ["Macro", "News"]
ungrouped = true         # with named groups: also the accounts in no group

# Live posts to a Discord channel (services/xfeed_svc/discord_feed.py). Each new post
# goes to the channel once, as a plain link on the FxEmbed host below, and Discord
# draws the post (text, images, video, quote) from that link. Only LIVE posts: an
# account's catch-up after downtime and its first page when added are not sent.
# The webhook is NOT here: put it in shared/notifications.json on the server as
# routes.x_feed.discord. With no webhook there, nothing is sent; it never falls
# back to another channel's webhook. The X feed's Discord switch on
# Settings -> General -> Push notifications also stops it.
[discord]
enabled = false          # true: send
groups = ["News"]        # "*" = every watched account; or group names, any case
ungrouped = false        # with named groups: also the accounts in no group
types = ["post", "reply"]  # any of "post", "reply" (a self-thread reply), "repost"
link_host = "fixupx.com" # FxEmbed's x.com mirror; "fxtwitter.com" also works
max_per_poll = 10        # most posts sent from one account's poll; the rest are skipped
send_gap_s = 2.0         # seconds between two posts (Discord allows about 30 a minute)
max_retries = 3          # retries after a rate limit (429), a server error or no answer
timeout_s = 10
queue_max = 200          # posts waiting to be sent; past it a new post is skipped
keep_days = 30           # how long the record of what was sent is kept
