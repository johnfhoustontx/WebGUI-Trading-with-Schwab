# ─────────────────────────────────────────────────────────────────────────────
# config/etf_holdings.toml — THE MACRO BOARD'S ETF HOVER CARD
#
#   Hovering a fund tile on the Macro Board (/market, and the public /macro)
#   shows its top holdings with each one's price and move from the previous
#   close. market_svc quotes them (services/market_svc/holdings.py) and
#   publishes cache:market:holdings. Read on every refresh: no restart.
#
#   ⚠ THE LISTS ARE KEPT BY HAND. Schwab's API serves no fund holdings, so
#     nothing here is derived. A fund's top five drift as prices move and as it
#     rebalances; `as_of` is the date they were last checked, and the card prints
#     it. Checked 2026-11-10 against stockanalysis.com's holdings pages.
#
#   ⚠ A FOREIGN STOCK IS ITS US LINE. The Countries funds hold shares listed in
#     Tokyo, Seoul, Taipei... which Schwab does not quote. Each is entered as its
#     US ADR, or its OTC line where there is no ADR, so its price is the US
#     line's in dollars and its move is that line's own day. A holding with no US
#     line at all was skipped and the next one taken, which is why EWT's fifth
#     name is its fourteenth holding.
#
#   ⚠ ONE COMPANY ONCE. Where a fund holds two classes (GOOGL + GOOG, Petrobras
#     common + preferred) the larger is listed and the next company taken.
#
#   A holding Schwab returns no quote for prints a dash, never 0. Every ticker
#   here was quoted through the proxy on 2026-11-12.
# ─────────────────────────────────────────────────────────────────────────────

enabled = true
# Holdings shown per card (a list may carry more, for when one stops quoting).
top_n = 5
# Seconds between quote fetches for the holdings: one proxy request each time.
rth_refresh_sec = 15
offhours_refresh_sec = 300
# A holding whose last trade is older than this shows its last price and the
# date it traded, and no move: a thin OTC line's "move" is against a close that
# can be months old (Samsung's SSNLF read +10% on 2026-11-12 with no trade since
# April). 96 hours clears a long weekend.
stale_after_h = 96
# The date the lists below were last checked against the funds' holdings.
as_of = "2026-11-10"

