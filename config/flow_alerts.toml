# Options-flow alert thresholds. Edit + restart options_svc to tune.
enabled = true          # whole-feature kill switch (server push side)

[crossover]
band = 0.02             # the crossing side must lead by >= 2% of the larger side
cooldown_min = 30       # per-symbol re-fire cooldown
min_premium = 10000     # skip crossover until the larger side clears this ($) — avoids tiny-premium open-session noise

[uoa]
k = 3.0                 # flag when volume >= k x open interest
vol_floor = 500         # min contract volume
premium_floor = 5000000 # min $ premium (mark x vol x 100) — $5M+, real money only
top_n = 3               # most-significant contracts per symbol per tick (by premium)

[gamma_flip]
enabled = true          # alert when spot crosses the dealer gamma flip level (positive<->negative regime)
band_pct = 0.0015       # hysteresis dead-zone: spot must clear the flip by 0.15% to switch regime (anti-chatter)
cooldown_min = 60       # per-symbol re-fire cooldown
symbols = ["$SPX", "SPY", "QQQ", "IWM"]   # which names to watch; empty [] = the whole flow universe

[big_delta]
enabled = true            # run the detector
push    = true            # PHONE-PUSH master gate. false = Flow screen only (no phone).
                          #             true = push the fires that ALSO clear push_threshold below.
push_threshold = 0.35     # PHONE-PUSH share bar, SEPARATE from rel_threshold's fire bar: the screen
                          #             still shows every rel_threshold fire, but only fires whose share
                          #             of gross >= this get a Telegram push (~15-20/day at 0.35 vs
                          #             ~100/day at 0.20). Raise to quiet the phone; lower to hear more.
rel_threshold = 0.25      # FIRE bar (screen). contract's delta-notional >= this share of the symbol's OWN gross
                          #             Raised 0.20 -> 0.25 on 2026-08-17: at 0.20 the detector fired
                          #             98-136/day and was ~33% of the whole flow channel (296 alerts on
                          #             08-17), against a design estimate of ~18/day. The response is a
                          #             CLIFF, not a slope — measured on real fires, not a re-model:
                          #             20% -> 98, 25% -> 23, 30% -> 11, 35% -> 8. min_contract_notional
                          #             deliberately left at $10M so the next reading isolates this knob.
min_contract_notional = 10000000   # AND >= this absolute $ ($10M) — a big share of a tiny name isn't real
delta_lo = 0.05           # delta band low  — drop near-zero delta (noise)
delta_hi = 0.85           # delta band high — drop deep-ITM (stock-replacement / assignment)
delta_max = 1.0           # sentinel guard  — drop |delta| > 1 (Schwab's -999 no-value)
top_n = 3                 # most-significant contracts per symbol per tick (by delta-notional)
