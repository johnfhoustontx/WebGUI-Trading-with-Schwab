# Options-flow alert thresholds. Edit + restart options_svc to tune.
enabled = true          # whole-feature kill switch (server push side)

[crossover]
band = 0.02             # the crossing side must lead by >= 2% of the larger side
cooldown_min = 30       # per-symbol re-fire cooldown
min_premium = 10000     # skip crossover until the larger side clears this ($) — avoids tiny-premium open-session noise

[uoa]
k = 3.0                 # flag when volume >= k x open interest
vol_floor = 500         # min contract volume
premium_floor = 5000000 # min $ premium (mark x vol x 100) — $5M+, real money only
top_n = 3               # most-significant contracts per symbol per tick (by premium)

[gamma_flip]
enabled = true          # alert when spot crosses the dealer gamma flip level (positive<->negative regime)
band_pct = 0.0015       # hysteresis dead-zone: spot must clear the flip by 0.15% to switch regime (anti-chatter)
cooldown_min = 60       # per-symbol re-fire cooldown
symbols = ["$SPX", "SPY", "QQQ", "IWM"]   # which names to watch; empty [] = the whole flow universe

[big_delta]
enabled = true            # run the detector
push    = true            # PHONE-PUSH master gate. false = Flow screen only (no phone).
                          #             true = push the fires that ALSO clear push_threshold below.
push_threshold = 0.35     # PHONE-PUSH share bar, SEPARATE from rel_threshold's fire bar: the screen
                          #             still shows every rel_threshold fire, but only fires whose share
                          #             of gross >= this get a Telegram push. Left at 0.35 for now, but
                          #             read this before tuning it:
                          #
                          #             ! A SHARE BAR SELECTS INVERSELY TO SIZE. pct_of_gross is a
                          #             contract's share of its OWN symbol's gross, and a deep book
                          #             spreads volume over hundreds of strikes while a thin one does
                          #             not -- so a huge index flow rarely clears 30% of its own gross
                          #             while a quiet name's single trade clears 60% easily. Measured
                          #             on 2026-09-09's real fires: the 12 that pushed had a MEDIAN of
                          #             $23.3M against $55.3M for all fires, and 9 of the 12 were under
                          #             $25M. The phone got IONQ (3,346 contracts, $10.1M, 67% share)
                          #             and did NOT get $SPX 7640P (179,112 contracts, $89.5B, 32%).
                          #             That is backwards, and no value of THIS knob fixes it -- raising
                          #             it selects harder for thin books, lowering it adds more of them.
                          #             The floor below is what actually corrects the mix (12 -> 3 that
                          #             day, leaving AVGO/JNJ/QQQ). If the phone later wants a real
                          #             significance gate, it needs a term that is not a share.
rel_threshold = 0.25      # FIRE bar (screen). contract's delta-notional >= this share of the symbol's OWN gross
                          #             Raised 0.20 -> 0.25 on 2026-08-17, expecting ~23/day. IT DID NOT
                          #             HAPPEN: 10 trading days at 0.25 measured 48-122 fires, mean ~70.
                          #             The "CLIFF" that raise relied on (20% -> 98, 25% -> 23) was an
                          #             artifact. A contract fires ONCE PER DAY, at its FIRST crossing
                          #             (handlers.py's shared cooldown seen-set), stamped with its share
                          #             at that moment -- and pct_of_gross is a RATIO whose numerator and
                          #             denominator both move, so it is NOT monotonic like UOA's vol/OI.
                          #             Raising the bar therefore DELAYS a contract's recording rather
                          #             than removing it: it is caught later, at a higher stamped share.
                          #             So a table of stamped shares under bar X cannot predict bar X+n,
                          #             and always reads low. Proof, three reconciliations, same shape --
                          #             contracts above 0.25 AT THE CLOSE vs contracts that fired all day:
                          #             08-28 21 vs 94, 09-01 14 vs 50, 09-09 17 vs 54, and in all three
                          #             "modelled but never fired" is ZERO. The day's count is the number
                          #             whose share ever PEAKS over the bar, ~3.5x the point-in-time count.
                          #             Left at 0.25 so the min_contract_notional move below is isolated.
min_contract_notional = 25000000   # AND >= this absolute $ ($25M) — a big share of a tiny name isn't real.
                          #             Raised $10M -> $25M on 2026-09-09, because at $10M the floor was
                          #             admitting precisely what it exists to exclude: across 16 archived
                          #             closing snapshots, 161 of 363 modelled fires (44%) sat under $25M,
                          #             median size 2,448 contracts against 62,077 in the $100M+ bucket --
                          #             a different phenomenon, not merely smaller flow. The repeat names
                          #             are thin-book mega-caps (BAC 17, CVX 13, PFE 11, KO 10, SOFI 9,
                          #             V 9, XOM 8, UBER 8); the clearest live case was V 365C firing on
                          #             426 CONTRACTS for 26% of Visa's gross. Unlike the share bar this
                          #             knob removes a CATEGORY rather than trimming signal -- every index
                          #             and mega-cap flow clears $25M untouched. Expect ~70 -> ~43/day;
                          #             that is a projection off the same model, so MEASURE it, don't
                          #             trust it (tools/run_flow_delta_instrumentation.sh).
delta_lo = 0.05           # delta band low  — drop near-zero delta (noise)
delta_hi = 0.85           # delta band high — drop deep-ITM (stock-replacement / assignment)
delta_max = 1.0           # sentinel guard  — drop |delta| > 1 (Schwab's -999 no-value)
top_n = 3                 # most-significant contracts per symbol per tick (by delta-notional)
