# Market news feed — every source news_svc polls, and how often.
# Read through shared/news_config.py (built-in defaults ← this file ← config/local/news.toml).
# Every key is editable in Settings -> Configuration.

[collector]
rth_poll_min      = 5      # 08:30–15:00 CT (shared.market_calendar)
offhours_poll_min = 15
weekend_poll_min  = 60     # Saturday, Sunday and NYSE holidays
keep_days         = 7      # rows older than this are pruned from news.db
view_items        = 300    # newest rows in the published views
request_timeout_s = 20
# The SEC requires a contact in the User-Agent and allows at most 10 requests/s.
sec_user_agent    = "NeuralStrike news_svc contact@neuralstrike.co"
# Every other feed. It must carry a browser-style "Mozilla/5.0" token: Yahoo
# answers a 404 page without one (checked 2026-09-26 - this value gets 200 from
# Yahoo, Google News and MarketWatch).
feed_user_agent   = "Mozilla/5.0 (compatible; NeuralStrike news_svc; +https://neuralstrike.co)"
# A response larger than this is refused rather than read (a runaway or hostile feed).
max_body_bytes    = 5000000
# Newest rows in the SEC panel's views (EDGAR kinds, split out of the headline feed).
sec_view_items    = 100

[tickers]
# Followed but not scanned. The base set is the GEX collection list (config/symbols.toml).
extras = []

[trending]
window_h = 6               # the Trending chips count mentions in this window

[dedupe]
# One feed publishing one headline twice within this many hours is ONE story - e.g.
# the same WSJ piece under two Google News redirect URLs minutes apart. Beyond it the
# two stay separate rows, so a daily column ("Morning Bid", ~24 h apart) is not
# folded into yesterday's. Two DIFFERENT feeds with one headline merge within a day
# regardless. 0 = off (one feed never merges its own headlines).
same_feed_merge_h = 6

