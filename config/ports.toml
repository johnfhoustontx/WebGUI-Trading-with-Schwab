# Base port table. A dev checkout (config/env.local.toml) shifts these by the
# profile's port_offset -- but only the ports repo_paths._derive_ports names.
#
#   [services]  -> offset AUTOMATICALLY. A new service here needs no code change.
#   top-level   -> NOT offset unless _derive_ports is taught about it. That would
#                  be correct for an external process this repo does not start,
#                  and is a BUG for one it does: dev would bind prod's port and
#                  the collision is invisible here.
#
# `proxy` is offset too, but a profile may pin `proxy_port` to opt out -- which is
# how dev borrows prod's proxy instead of holding a second Schwab refresh token.
# `memurai` is never offset: both environments share one Redis server and are
# separated by the profile's redis_db index instead.
#
# See docs/plans/2026-08-08-dev-prod-environments-design.md.
proxy = 8100
nicegui = 8500
# The PUBLIC read-only screens (live.neuralstrike.co), a second NiceGUI process.
# Offset with `nicegui` -- see the header note: a top-level port this repo
# STARTS must be offset, or dev binds prod's and the collision is invisible.
nicegui_live = 8501
memurai = 6379

[services]
sentiment = 8210
options   = 8211
portfolio = 8212
trade     = 8213
market    = 8215
news      = 8216   # public-feed news collector (news_svc)
