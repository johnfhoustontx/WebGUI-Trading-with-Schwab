# ============================================================================
# App styling — edit this file, then RESTART THE WEB GUI to apply
# (More → System Status → Restart on the "Web GUI" card, then reload the page).
#
# Colors are "#rrggbb" hex; [typography] sizes are in PIXELS (a bare number
# works: "15" = "15px"). Any key you delete (or mistype) simply falls back to
# the built-in default shown here, so this file is always safe to edit.
# Loader: webgui/pages/options/theme.py:load_theme().
# Tip: easiest way to edit — Settings → Appearance in the app itself.
#
# ── ACTIVE PALETTE: "Deep Slate" (2026-07-11) ───────────────────────────────
# Content-area palette + typography adopted from the "Deep Slate" redesign
# handoff: deep charcoal-blue chrome, a single blue accent (#6b86ff), semantic
# red/green P&L, IBM Plex type with tabular-nums. Hairline borders are given as
# solid-hex approximations of the spec's white-alpha values (the token layer
# builds Tailwind classes, which are kept hex-only). The [menu] app-shell knobs
# are intentionally left at the stock look for this phase — see the adoption
# plan (docs/plans/2026-07-11-deep-slate-adoption-plan.md).
#
# NOT covered here (deliberately): per-chart Highcharts colorscales (e.g. the
# Gamma heatmap), the data-driven table-cell zone colors (score/heat/P&L maps),
# and the standalone EOD/Analyze report documents.
# ============================================================================

[palette]                      # ── surfaces + text + buttons ────────────────
page_bg1     = "#111731"       # page background gradient — top-center glow (raised-panel tone)
page_bg2     = "#0c1020"       # page background gradient — app background
page_bg3     = "#0a0e1c"       # page background gradient — edges / rail
page_border  = "#1b2138"       # page frame border (hairline approx)
card_bg      = "#0f1428"       # cards / frames / popup menus
card_border  = "#1c2340"       # card + popup border (hairline approx)
text         = "#c7cee6"       # base body text
title        = "#eef1f6"       # headings / titles (the LABEL token)
muted        = "#8891ab"       # secondary text, field labels
icon         = "#6d76a0"       # icons, eyebrows, inactive tabs (faint)
input_bg     = "#141a30"       # boxed input fill (table header / inset tone)
input_border = "#252c46"       # boxed input border
input_text   = "#eef1f6"       # input text, active tab, popup items
focus        = "#6b86ff"       # focus ring, tab indicator, hover accents (blue accent)
btn_bg       = "#171e39"       # secondary button fill
btn_hover    = "#20284a"       # secondary button + popup item hover
btn_border   = "#2a3358"       # secondary button border
primary      = "#6b86ff"       # primary button fill (blue accent)
primary_hover = "#5877f2"      # primary button hover

[semantic]                     # ── state colors (labels, tiles, detail panel) ─
positive = "#4dd6a0"           # good / up / profit (text-optimized green)
warning  = "#e6b45a"           # caution / hold (amber)
negative = "#f08183"           # bad / down / loss (text-optimized red)
neutral  = "#9ba4c4"           # flat / no signal (secondary text)

[buttons_3d]                   # ── the standard 3D gradient buttons ─────────
blue_top    = "#8398ff"        # main action button — gradient top
blue_mid    = "#6b86ff"        #   gradient middle (blue accent)
blue_bottom = "#586fe6"        #   gradient bottom
blue_lip    = "#3a4aa0"        #   the hard 3D "lip" shadow under the button
red_top     = "#f08183"        # danger button (Delete etc.) — gradient top
red_mid     = "#e5595b"        #   gradient middle
red_bottom  = "#c9484a"        #   gradient bottom
red_lip     = "#7a2a2b"        #   the 3D lip

[gauge]                        # ── the speedometer gauges ───────────────────
low    = "#e5595b"             # left of the arc (0)
mid    = "#e6b45a"             # middle of the arc (50)
high   = "#35c281"             # right of the arc (100)
needle = "#eef1f6"             # needle + pivot

[charts]                       # ── Sentiment / Sector-Rotation value colors ─
green  = "#4dd6a0"             # positive values (lines, zones, table text)
red    = "#f08183"             # negative values
yellow = "#e6b45a"             # mid-band / caution values
flat   = "#8891ab"             # flat / no-data
cyan   = "#6b86ff"             # the "Improving" RRG accent (Deep Slate → blue)

[typography]                   # ── text categories: font + sizes ────────────
# Sizes are in PIXELS — a plain number works too ("15" = "15px"); a larger
# number = bigger text. family "" keeps the app default (Roboto). font_url ""
# loads no web font; numeric "" = default figures ("tabular" = tabular-nums
# app-wide). Density: the Deep Slate type scale (denser than the framework
# defaults) — 16px screen title, 13px body/table cell, 11px captions. Bump any
# value back up if a screen feels cramped.
family    = "'IBM Plex Sans', system-ui, sans-serif"   # app-wide UI font
font_url  = "https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
numeric   = "tabular"          # tabular-nums app-wide (aligned numeric columns)
titles    = "16px"             # page & card titles (Deep Slate screen title)
subtitles = "14px"             # section headings
sections  = "13px"             # sub-section headings
body      = "13px"             # base text / table cells
small     = "11px"             # eyebrows / captions / status lines

[brand]                        # ── app identity: the header lockup ──────────
# The name is split in two so each half carries its own gradient, the way the
# logo artwork does. These apply to the HEADER WORDMARK ONLY — the body/data
# font stays [typography].family below, because a heavy display face hurts
# readability in the dense signal tables.
#
# The colors are SAMPLED from webgui/static/img/neuralstrike-logo.jpg (the
# p50→p95 range of each wordmark band; lower percentiles are anti-aliasing
# against the black background and read too dark), so the header matches the
# artwork rather than approximating it by eye.
#
# font_family is a CLOSE FREE MATCH for the logo's typeface, not a positive
# identification — the exact face can't be read off a raster image. Montserrat
# ExtraBold is a geometric sans with the same proportions. To try another,
# change both font_family and font_url (any Google Fonts URL works), restart the
# web GUI, and hard-refresh. Setting font_url = "" loads no web font and falls
# back to the local stack (still readable, just not the logo face).
#
# mark = the monogram shown left of the wordmark, served from webgui/static/.
# It is a square crop of the full logo (which is portrait and carries its own
# wordmark + tagline — unreadable at the header's 28px). Set "" for no image:
# the header then shows the name alone, no broken-image icon.
name_a      = "Neural"
name_b      = "Strike"
font_family = "Montserrat"
font_url    = "https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap"
font_weight = "800"
a_from      = "#C9A356"        # "Neural" — deep gold
a_to        = "#FBEAA0"        # "Neural" — highlight gold
b_from      = "#2C6FB4"        # "Strike" — deep blue
b_to        = "#35A3F5"        # "Strike" — bright blue
mark        = "/static/img/neuralstrike-mark.png"

[menu]                         # ── application menu (header bar + left nav) ─
# Deep Slate shell (Phase 2): dark header + rail with a blue accent on the active
# pill/tab. Every knob "" = keep the stock look.
#
# READ THIS BEFORE CHANGING `accent`: it feeds ui.colors(primary=…) and therefore
# reaches ONLY Quasar-colored controls (switches, sliders, color=primary buttons).
# It does NOT recolor the header bar (decoupled via header_bg below), and it does
# NOT recolor the active nav pill, the tab-strip fills, or the active nav icon —
# those are HARDCODED rgba/hex in main._NAV_CSS, because the bundled Tailwind JIT
# won't reliably emit var()/rgba() arbitraries, so they can't ride --q-primary.
# The lie is invisible today only because #6b86ff == rgb(107,134,255), the value
# hardcoded there: the knob LOOKS like it drives the pill/tab/icon until you
# change it and they silently stay blue. To move them, edit main._NAV_CSS too.
accent    = "#6b86ff"          # Quasar-primary controls ONLY (switches/sliders/buttons)
header_bg = "#111731"          # top header bar background (dark — decoupled from accent)
drawer_bg = "#0a0e1c"          # left nav rail background
text      = "#98a1c0"          # menu item text + icons (inactive tone; active → light)
hover_bg  = "rgba(107,134,255,0.08)"  # menu item hover wash
title     = "#565f7d"          # the "WORKSPACE" drawer caption

[console]                      # ── Market Regime Console (/sentiment ONLY) ──
# A hard-edge "console" language, deliberately scoped to ONE page: square
# corners, near-black ground, teal accent, glow-only shadows (no elevation).
# Source of truth: docs/design/2026-08-14-market-regime-console/README.md.
# Plan + spike results: docs/plans/2026-08-14-sentiment-console-redesign-plan.md.
#
# Nothing else in the app reads these — every other page keeps the Deep Slate
# palette above. This section is NOT shown in Settings → Appearance, for the
# same reason [brand] is not: that editor's sections are single-kind, and this
# one mixes colours with font text.
#
# HEX ONLY, like every other section. The spec quotes several of these as
# rgba(120,140,160,α); the ALPHA lives in the token layer instead (Tailwind's
# `/[0.18]` modifier — measured to generate), so `line` below is ONE base
# colour serving every hairline, border and meter track at its own opacity.
page_bg     = "#05070b"        # the page ground
wash        = "#0b1620"        # inner stop of the radial page wash
card_from   = "#0e161e"        # card gradient (160deg); both stops rendered @95%
card_to     = "#070a0f"
cell_bg     = "#0a0e14"        # stat/readout cells inside a hairline grid
line        = "#788ca0"        # every hairline / card border / meter track
accent      = "#22e3d3"        # dial arc, links, header+footer rules
# text ramp, lightest → faintest
text_primary   = "#e7edf3"
text_secondary = "#a9bac7"
text_muted     = "#8fa1b0"
text_label     = "#6b7d8d"
text_dim       = "#5d6f7e"
text_faint     = "#4b5a67"
# data colours
positive    = "#35d68a"        # bullish / positive change / high scores
negative    = "#f2646b"        # stressed / negative change / divergence
warning     = "#e0b74e"        # caution, previous close, mid-low scores
olive       = "#b9cf6a"        # mid-high score band
yellow      = "#d7d76a"        # trend day band
# Regime hues — the CONSOLE's, which differ from [charts] used elsewhere
# (balanced cyan→blue, whipsaw flat-grey→light grey, breakout yellow→amber).
# The handoff is authoritative for this page.
regime_mean_reversion = "#6f86ff"
regime_trending       = "#35d68a"
regime_breakout       = "#f0b83c"
regime_breakout_zero  = "#6a5c33"   # the dormant / 0.0% muted state
regime_choppy         = "#c3ccd6"
regime_crisis         = "#f2646b"
# Condensed display face for headings, regime names and hero numerals, loaded
# separately from [typography] and [brand]. "" loads nothing and falls back to
# the app font — which measures 21% WIDER than Rajdhani, so letter-spaced
# headings reflow when the webfont arrives (display=swap). Don't pack them tight.
font_family = "Rajdhani"
font_url    = "https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"

[flow]                         # ── Options Flow panels (/options/gamma ONLY) ─
# The Premium Divergence (Flow view) + Flow Field (Net Prem view) redesign.
# Page-scoped like [console] and [macro], and NOT surfaced in Settings →
# Appearance for the same reason: that editor's sections are single-kind.
#
# call/put are DELIBERATELY the same pair as the plasma heatmap's POS/NEG
# colours. These panels sit behind the same subtab strip, so a cyan that meant
# "call" on one tab and something else on the next would be worse than no
# colour coding at all — change them together or not at all.
#
# The per-symbol line colours on Flow Field are NOT here: they live in
# gamma.NET_PREM_COLORS, one fixed hue per symbol across all 28, pinned by tests
# for mutual distinctness. A 15-colour section could not cover them.
call       = "#35C8FF"         # call premium (= gamma POS_COLOR)
put        = "#FF4D8D"         # put premium  (= gamma NEG_COLOR)
spot       = "#EAF6FF"         # underlying price — white, not yellow: yellow
                               # read as a third premium series
call_line  = "#7FDCFF"         # hairline drawn over the call glow
put_line   = "#FF86B3"
call_deep  = "#2A76E0"         # far stop of the call ribbon gradient
put_deep   = "#96247A"
live       = "#5EF0B8"         # streaming pill + its pulsing dot
panel_from = "#0B1A2C"         # 150deg panel wash, three stops
panel_mid  = "#060E1A"
panel_to   = "#04080F"
title      = "#E8F7FF"
label      = "#AECDE8"         # every muted label, used at several alphas
ice        = "#BEF8FF"         # chip rings, the cursor, the FLAT rule
grid       = "#78AAD2"         # gridlines, rendered at ~6% — a hair, not a rule

[macro]                        # ── Macro Board redesign (/market ONLY) ──────
# A dense "instrument panel" language scoped to ONE page: notched (clip-path)
# panels + tiles, near-black ground, magnitude-scaled heat wash, flash-on-change.
# Source of truth: the approved macro-board redesign spec + reference prototype.
# Like [console] + [brand], this is page-scoped and NOT shown in Settings →
# Appearance (that editor's sections are single-kind; this mixes colours + font +
# a tuning number). HEX ONLY; alphas live in the token layer (Tailwind `/[…]`).
void    = "#03060D"            # page background base
panel   = "#080D18"            # group panel fill
tile    = "#0A1020"            # tile fill (Skin A)
grid    = "#0E1728"            # inert bar/meter tracks
edge    = "#182741"            # default borders
edge_hi = "#26405F"            # emphasis borders
txt     = "#DCE8F8"            # primary values
dim     = "#6B7F9E"            # symbols, labels
faint   = "#3D4F6B"            # descriptors, flat-tile accents
up      = "#00E5A0"            # positive / risk-on change
dn      = "#FF4D6D"            # negative / risk-off change
flat    = "#5C6F8C"            # zero change
cyan    = "#35E0FF"            # rail accent, live indicator
wash_in = "#0A1830"            # inner stop of the page radial gradient
# Saturation ceiling (percent): the |%change| at which the heat wash maxes out.
# The one number worth tuning per session volatility — lower it if flat days look
# washed out, raise it if a busy tape saturates everything.
sat_ceiling = 0.45
# Three faces, loaded page-scoped (one combined request), matching the prototype:
# Chakra Petch (board title), Rajdhani (ticker symbols), IBM Plex Mono (numbers).
# Tracking values are tuned to these faces — system fallbacks reflow noticeably.
font_url = "https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"

[sectors]                      # ── Sector & Industry heat grid (/sentiment/sectors ONLY)
# A magnitude-forward heat grid: Day / Week / Month render as three adjacent
# filled tiles flush right, forming one continuous colour band down the page.
# Like [console] + [macro] + [brand] this is page-scoped and NOT shown in
# Settings → Appearance (that editor's sections are single-kind; this mixes
# colours with a font URL). HEX ONLY; alphas live in the token layer.
#
# NOT here, on purpose: the green/red heat ramp itself. It is a data-driven cell
# map (oklch L 0.175→0.300, C 0.022→0.110, hue 158 up / 22 down), the category
# CLAUDE.md excludes from the config-driven palette alongside the gauge face and
# the score/heat/P&L zone maps. It lives in webgui/pages/sector_heat.py.
void    = "#080808"            # page ground — the flat end of the heat ramp
edge    = "#1A1A1A"            # row hairlines
edge_hi = "#2C2C2C"            # header rule, button outlines
txt     = "#F2F2F2"            # sector names, the regime headline
dim     = "#8C8C8C"            # ETF codes, put/call, button labels
faint   = "#5A5A5A"            # column headers, rank lines, composition
up      = "#3FD98A"            # risk-on regime word + dot
dn      = "#E8697B"            # risk-off regime word + dot
warn    = "#E0A63C"            # mixed regime, and put/call above 1.5
# Two faces, loaded page-scoped in one request: Instrument Sans for names,
# JetBrains Mono for every figure. The mono face is what makes tabular-nums
# align digits down a column — a system fallback is a visible downgrade.
font_url = "https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

[rotation]                     # ── Sector Rotation board (/sentiment/rotation ONLY)
# A verdict strip (regime · diverging spread gauge · spread vs its trigger), a
# weight-proportional flow band, and four quadrant panels. Page-scoped like
# [console] / [macro] / [sectors], and NOT shown in Settings → Appearance.
#
# ONLY the two grounds and the faces are here, on purpose. Everything else on
# the board is either the WARM-NEUTRAL LADDER — oklch(L 0.006-0.01 90), one
# lightness step per role so the hierarchy is visible in the source — or the
# FOUR QUADRANT HUES (Leading 158 / Improving 232 / Weakening 80 / Lagging 22).
# Both are design ramps rather than palette knobs, so both live in
# webgui/pages/rotation_view.py, the same call made for the [sectors] heat ramp.
#
# ⚠ Those quadrant hues are PAGE-SCOPED and deliberately differ from the RRG
# tab's (sentiment_rotation.quadrant_color: green/cyan/yellow/red), which still
# drives the RRG scatter and the Sector & Industry quadrant text.
void  = "#08090B"              # page ground
panel = "#0B0C0E"              # quadrant panel fill, one step lighter
# Same two faces as [sectors] — the screens are one design family — but declared
# per page so either can be restyled without silently changing the other.
font_url = "https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"

[calc]                         # ── Options Strategy Calculator (/options/calculator ONLY)
# A near-black instrument ground with cyan / green / amber signal colours and a
# single mono face — deliberately NOT the app-wide dark navy the Simulator and
# Trade pages wear. Page-scoped like [console] / [macro] / [sectors] /
# [rotation], and NOT shown in Settings → Appearance (that editor's sections are
# single-kind; this mixes colours with a font URL). HEX ONLY; alphas live in the
# token layer (Tailwind `bg-[rgba(...)]`, written with no spaces).
#
# Scope hook is `.calc-v3` — never `.calc-v2`, which is the shared dark-navy
# scope. NOT here, on purpose: the P&L heatmap's green/red cell ramp, a
# data-driven map of the category CLAUDE.md excludes from the config palette.
void      = "#05070a"          # page ground, the outer stop of the radial glow
glow      = "#0b1a24"          # inner stop of that radial gradient
frame_a   = "#0b1118"          # numbered-frame fill, top of a 180deg gradient
frame_b   = "#06090d"          # …and its bottom stop
edge      = "#26505c"          # active frame border, and the strategy popup's
edge_idle = "#1d2937"          # idle frame border — a frame with nothing in it
chip_bg   = "#06080b"          # the frame's label chip, knocked out of the edge
tile_a    = "#0d141c"          # summary-tile fill, top of a 180deg gradient
tile_b    = "#070b0f"          # …and its bottom stop
tile_edge = "#1d2937"          # tile hairline
input_bg  = "#0a1219"          # boxed q-field fill
input_edge = "#2a3846"         # boxed q-field hairline (focus ring = accent)
bright    = "#eaf2f9"          # headline values
txt       = "#cfdae8"          # page base text
soft      = "#dce7f3"          # input + menu-item text
label     = "#7189a0"          # eyebrows and q-field labels
muted     = "#8aa0b4"          # secondary annotation
body      = "#93a8bb"          # running prose
dim       = "#6f8598"          # least-emphasis figures
pos       = "#2dd4a7"          # profit / credit
neg       = "#fb5f7c"          # loss / debit
accent    = "#22d3ee"          # the primary signal colour: focus, primary button
warn      = "#f5b841"          # caution — near a breakeven, a stale quote
btn_bg    = "#111b25"          # secondary button fill (also the menu hover)
btn_edge  = "#3a5060"          # secondary button hairline
btn_txt   = "#d3e0ec"          # secondary button label
off_bg    = "#101720"          # disabled button fill
off_edge  = "#26313d"          # disabled button hairline
off_txt   = "#5c6d7e"          # disabled button label
# One face, loaded page-scoped: JetBrains Mono is what makes tabular-nums align
# the matrix columns optically — a system fallback is a visible downgrade.
font_url = "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
