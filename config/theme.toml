# ============================================================================
# App styling — edit this file, then RESTART THE WEB GUI to apply
# (More → System Status → Restart on the "Web GUI" card, then reload the page).
#
# Colors are "#rrggbb" hex; [typography] sizes are CSS lengths ("15px"/"1.1rem").
# Any key you delete (or mistype) simply falls back to the built-in default
# shown here, so this file is always safe to edit. Loader:
# webgui/pages/options/theme.py:load_theme().
#
# NOT covered here (deliberately): per-chart Highcharts colorscales (e.g. the
# Gamma heatmap), the data-driven table-cell zone colors (score/heat/P&L maps),
# and the standalone EOD/Analyze report documents.
# ============================================================================

[palette]                      # ── surfaces + text + buttons ────────────────
page_bg1     = "#16243f"       # page background gradient — center glow
page_bg2     = "#0c1424"       # page background gradient — middle
page_bg3     = "#0a0f1c"       # page background gradient — edges
page_border  = "#1d2942"       # page frame border
card_bg      = "#101a30"       # cards / frames / popup menus
card_border  = "#213152"       # card + popup border
text         = "#cdd8ee"       # base body text
title        = "#eaf0fb"       # headings / titles (the LABEL token)
muted        = "#7f8db0"       # secondary text, field labels
icon         = "#8794b4"       # icons, eyebrows, inactive tabs
input_bg     = "#0c1426"       # boxed input fill
input_border = "#243353"       # boxed input border
input_text   = "#e7edf8"       # input text, active tab, popup items
focus        = "#3b82f6"       # focus ring, tab indicator, hover accents
btn_bg       = "#15213b"       # secondary button fill
btn_hover    = "#1b2950"       # secondary button + popup item hover
btn_border   = "#2a3a5c"       # secondary button border
primary      = "#2563eb"       # primary button fill
primary_hover = "#1d4fd1"      # primary button hover

[semantic]                     # ── state colors (labels, tiles, detail panel) ─
positive = "#66bb6a"           # good / up / profit
warning  = "#ffa726"           # caution / hold
negative = "#ef5350"           # bad / down / loss
neutral  = "#bdbdbd"           # flat / no signal

[buttons_3d]                   # ── the standard 3D gradient buttons ─────────
blue_top    = "#5aa0e6"        # main action button — gradient top
blue_mid    = "#3a7bc0"        #   gradient middle
blue_bottom = "#316eac"        #   gradient bottom
blue_lip    = "#244e78"        #   the hard 3D "lip" shadow under the button
red_top     = "#ef6b6b"        # danger button (Delete etc.) — gradient top
red_mid     = "#d33f3f"        #   gradient middle
red_bottom  = "#b53030"        #   gradient bottom
red_lip     = "#7a1f1f"        #   the 3D lip

[gauge]                        # ── the speedometer gauges ───────────────────
low    = "#ef5350"             # left of the arc (0)
mid    = "#ffd54f"             # middle of the arc (50)
high   = "#66bb6a"             # right of the arc (100)
needle = "#f5f5f5"             # needle + pivot

[charts]                       # ── Sentiment / Sector-Rotation value colors ─
green  = "#66bb6a"             # positive values (lines, zones, table text)
red    = "#ef5350"             # negative values
yellow = "#ffd54f"             # mid-band / caution values
flat   = "#9e9e9e"             # flat / no-data
cyan   = "#3fb6c7"             # the "Improving" RRG accent

[typography]                   # ── text categories: font + sizes ────────────
# Sizes accept any CSS length ("15px", "1.1rem"). family "" keeps the app
# default (Roboto); e.g. family = "Georgia, serif" or "'Segoe UI', sans-serif".
family    = ""                 # app-wide font family ("" = default Roboto)
titles    = "1.25rem"          # page & card titles
subtitles = "1rem"             # section headings
sections  = "0.875rem"         # sub-section headings
body      = "14px"             # base text
small     = "12px"             # eyebrows / captions / status lines

[menu]                         # ── application menu (header bar + left nav) ─
# Every knob "" = keep the stock look; set a color to override.
accent    = ""                 # header bar + selected item pill (Quasar primary)
drawer_bg = ""                 # menu panel background
text      = ""                 # menu item text + icons
hover_bg  = ""                 # menu item hover wash
title     = ""                 # the "SCHWAB TRADING" caption
