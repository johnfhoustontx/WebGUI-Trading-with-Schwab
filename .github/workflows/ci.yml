name: CI

# Runs lint + the per-folder test matrix + a dependency audit on every push/PR.
#
# WHY windows-latest: the stack is Windows-first — it imports winotify (a
# Windows-only toast library) and touches tkinter/Memurai; a Linux runner fails at
# import time. Tests need NO live services (the bus falls back to fakeredis under
# pytest — see shared/bus/client.py; the proxy is mocked), so no Redis service
# container is required.
#
# WHY a matrix of per-folder jobs: running the whole tree in one pytest invocation
# re-triggers the documented cross-app top-level module-name collisions
# (config / scoring / notifier / src). Each suite runs in isolation, exactly as the
# root CLAUDE.md "Tests" section prescribes:
#   * the clean 3-tier suites (shared/*, services/*) run FROM THE REPO ROOT as
#     `python -m pytest <path>` (their entrypoints add the repo root to sys.path);
#   * the app folders (webgui, schwab-proxy, options-scanner, sentiment-dashboard,
#     trade-analyzer, portfolio-analyzer) run FROM INSIDE the folder (working-directory).
# The copied LEGACY engine dirs are marked `soft` (continue-on-error): they were
# copied verbatim and carry pre-existing debt (options-scanner has ~2 date-relative
# + tkinter-display failures documented in CLAUDE.md), so a red legacy suite surfaces
# for review without wedging the clean-stack gate.

# TRIGGERS — deliberately narrow, because this matrix is EXPENSIVE.
# Measured on the last full green run (2026-08-07): 18 jobs, 3,085 job-seconds
# = 51.4 wall-minutes, and every job is `windows-latest`, which GitHub bills at
# a 2x multiplier => ~103 BILLABLE MINUTES PER RUN. Against the 2,000 min/month
# free private-repo allowance that is ~19 runs; the previous config
# (`push: branches: ["**"]` PLUS `pull_request`) fired the whole matrix on every
# WIP commit on every branch AND again on the PR, roughly halving that to ~9-10.
# The quota ran out on 2026-08-08 and every run since failed instantly at 0
# steps — which looks exactly like a broken build but is GitHub declining to
# schedule, so CI was silently DARK rather than red.
#
# Push runs are therefore limited to the two INTEGRATION branches. `main` is the
# default branch, but the real trunk is `Using_Highcharts` — feature work merges
# there (see the merge history), so omitting it would disable CI exactly where
# the code actually lands. Feature branches get coverage via `pull_request`, or
# on demand: `gh workflow run ci.yml --ref <branch>`.
#
# paths-ignore skips docs-only commits (a CLAUDE.md edit should not cost 103
# minutes). It applies only when EVERY changed path matches, so the common
# code+CLAUDE.md commit still runs the full matrix. Safe on `pull_request` here
# because branch protection / required status checks are unavailable on this
# plan — with required checks, a skipped workflow never reports and would block
# the PR forever.
on:
  push:
    branches: [main, Using_Highcharts]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — the mechanical bug backstop (ruff config lives in pyproject.toml).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev tooling (ruff, pytest, pip-audit)
        run: pip install -r requirements-dev.txt
      - name: Ruff lint (rules + scope in pyproject.toml [tool.ruff])
        run: ruff check .
        # NB: `ruff format` is intentionally NOT enforced — the codebase uses a
        # deliberate compact style (one-line statements) the formatter would rewrite
        # wholesale. The lint gate (select E9,F63,F7,F82) catches real bugs only.

  # ---------------------------------------------------------------------------
  # Dependency CVE audit — non-blocking initially (a freshly-disclosed transitive
  # CVE should surface for review, not halt all development). Flip to blocking
  # once the baseline is clean.
  # ---------------------------------------------------------------------------
  audit:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned runtime + audit tool
        run: |
          pip install -r requirements.lock
          pip install pip-audit
      - name: pip-audit (dependency CVE scan)
        run: pip-audit

  # ---------------------------------------------------------------------------
  # Tests — one isolated job per suite (see the header note on module collisions).
  # `dir: "."` runs from the repo root (services/shared); an app-folder `dir` runs
  # the suite from INSIDE that folder. `soft: true` => continue-on-error.
  # ---------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- clean 3-tier suites (from repo root) ---
          - name: shared-bus
            dir: "."
            cmd: python -m pytest shared/bus -q
          - name: shared-contracts
            dir: "."
            cmd: python -m pytest shared/contracts -q
          - name: scaffold
            dir: "."
            cmd: python -m pytest services/tests -q
          - name: sentiment_svc
            dir: "."
            cmd: python -m pytest services/sentiment_svc -q
          - name: options_svc
            dir: "."
            cmd: python -m pytest services/options_svc -q
          - name: portfolio_svc
            dir: "."
            cmd: python -m pytest services/portfolio_svc -q
          - name: trade_svc
            dir: "."
            cmd: python -m pytest services/trade_svc -q
          - name: driver_svc
            dir: "."
            cmd: python -m pytest services/driver_svc -q
          - name: market_svc
            dir: "."
            cmd: python -m pytest services/market_svc -q
          # tools/ is a utilities dir and was historically left out of CI. It is
          # in now because tools/nq_signal.py is trading-signal logic carrying a
          # money-losing invariant (never fade a short-gamma tape) — a silent
          # regression there costs real money, which is not true of the
          # check_env / db_admin / watchdog tests it rides along with. Those
          # tests all sys.path-insert rather than relying on cwd, so they pass
          # from the repo root as well as from inside tools/.
          - name: tools
            dir: "."
            cmd: python -m pytest tools/tests -q
          # --- app folders (run FROM INSIDE the folder) ---
          - name: webgui
            dir: webgui
            cmd: python -m pytest -q
          - name: schwab-proxy
            dir: schwab-proxy
            cmd: python -m pytest tests -q
          # --- LEGACY engine dirs — grandfathered, non-blocking (soft) ---
          - name: options-scanner
            dir: options-scanner
            soft: true
            # Deselect the documented pre-existing baseline failures (tkinter
            # dashboard tests need a display + crash headless; the earnings tests
            # are date-relative; test_key_levels_doc references an uncopied doc).
            cmd: >-
              python -m pytest tests -q
              --ignore=tests/test_dashboard_captured_signals_drift.py
              --ignore=tests/test_dashboard_tree_signal_map.py
              --ignore=tests/test_key_levels_doc.py
              --deselect "tests/test_scanner_engine.py::TestEarningsAvoidance"
          - name: sentiment-dashboard
            dir: sentiment-dashboard
            soft: true
            cmd: python -m pytest tests -q
          - name: trade-analyzer
            dir: trade-analyzer
            soft: true
            cmd: python -m pytest . -q
          - name: portfolio-analyzer
            dir: portfolio-analyzer
            soft: true
            cmd: python -m pytest tests -q
    name: test (${{ matrix.name }})
    continue-on-error: ${{ matrix.soft == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned runtime deps
        run: pip install -r requirements.lock
      - name: Run ${{ matrix.name }} suite
        working-directory: ${{ matrix.dir }}
        run: ${{ matrix.cmd }}
