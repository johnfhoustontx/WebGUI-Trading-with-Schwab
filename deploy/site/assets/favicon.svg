<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeuralStrike">
  <!-- The design's own mark: the wordmark's two halves, N in text and S in the
       accent, on the Nocturne ground. Colours are literals because an SVG
       served as an icon gets no stylesheet. -->
  <rect width="64" height="64" rx="12" fill="#161826"/>
  <circle cx="50" cy="14" r="20" fill="#2b2741"/>
  <text x="11" y="45" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#e9e9ed">N</text>
  <text x="32" y="45" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#9184d9">S</text>
</svg>
